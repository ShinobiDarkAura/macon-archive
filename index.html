  .fcard.important{background:#fff}
  .fcard.important:hover{background:#fff}
  .fcard .fn svg{flex:0 0 auto;margin-right:4px}
  .fdraft{color:var(--notes,#C04722);font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
  .fimp{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--accent-grad);z-index:6;box-shadow:0 0 0 2.5px #fff,0 1px 4px rgba(198,92,70,.45)}
  .donechip{position:absolute;top:14px;right:16px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;
    border:none;background:rgba(43,38,34,.06);color:#9a9286;line-height:1;cursor:pointer;z-index:3;
    transition:background .18s ease,color .18s ease}
  .donechip svg{width:19px;height:19px}
  .donechip:hover{background:#4f7d57;color:#fff}
  .donechip.done{background:#4f7d57;color:#fff}
  .daychip.High{background:#c0392b}
  .daychip.Medium{background:#b5651d}
  .daychip.Low{background:#3a6ea5}
  /* collapsed rail */
  .drawer-rail{position:fixed;top:0;right:0;height:100vh;width:20px;border:none;
        background:var(--accent);cursor:pointer;z-index:44;display:none;transition:width .2s ease;padding:0;
        box-shadow:-10px 0 26px rgba(40,37,35,.26)}
  body.drawer-collapsed .drawer-rail{display:none}
  .rail-handle{position:fixed;right:8px;top:50%;transform:translateY(-50%);width:4px;height:24px;border-radius:2px;background:var(--rule);z-index:44;cursor:pointer;display:none;transition:background .15s}
  .rail-handle:hover{background:var(--slate)}
  body.drawer-collapsed .rail-handle{display:block}
  .rail-dot{width:6px;height:6px;border-radius:50%;background:#fff;flex:0 0 auto}
  .drawer-rail:hover{width:28px}
  .drawer-rail #railLabel{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#fff}
  @media(max-width:820px){
    body{padding-right:0}
    .drawer{width:min(380px,86vw)}
  }

  /* ---------- Detail / provenance card ---------- */
  .scrim{position:fixed;inset:0;background:rgba(43,38,34,.45);display:none;align-items:center;
         justify-content:center;padding:40px 20px;overflow:auto;z-index:70}
  .scrim.show{display:flex}
  .card{background:var(--paper);max-width:680px;width:100%;border:1px solid var(--rule);border-radius:12px;
        box-shadow:0 24px 60px var(--shadow);position:relative;overflow:hidden}
  .card .seal{position:absolute;right:24px;top:22px;width:74px;height:74px;border:2px solid var(--seal);border-radius:50%;
        color:var(--seal);display:flex;align-items:center;justify-content:center;text-align:center;
        font-family:"Cormorant Garamond",serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
        line-height:1.25;opacity:.7;transform:rotate(-8deg)}
  .card-body{padding:40px 44px 32px}
  .card input,.card textarea,.card select,.card .btn{border-radius:4px}
  .card h2{font-family:"Louize",Georgia,serif;font-weight:400;font-size:29px;letter-spacing:.02em;margin:0 0 28px}
  .card h2:has(+ .acc-line),.card h2:has(+ .dchips){margin-bottom:7px}
  .card .acc-line{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:28px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;margin-bottom:8px}
  .field{padding:11px 0;border-bottom:1px solid var(--rule)}
  .field.full{grid-column:1/-1}
  .field label{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);margin-bottom:5px}
  .field .val{font-size:17px;min-height:22px}
  .field .val:empty::before{content:"—";color:var(--rule)}
  .field .val.script{font-family:var(--serif-soul);font-style:italic;font-size:19px;line-height:1.35}
  .card-actions{display:flex;justify-content:space-between;gap:10px;padding:20px 44px 34px}
  .modal-x{position:absolute;top:16px;right:18px;width:32px;height:32px;border:none;background:transparent;color:var(--slate);font-size:24px;line-height:1;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:6;transition:background .12s,color .12s}
  .modal-x:hover{background:var(--paper-2);color:var(--ink)}
  /* Draft modal extras */
  .dpri{position:absolute;top:30px;right:34px;width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fffbf0;font-size:20px;font-weight:700;line-height:1;z-index:1}
  .dpri.High{background:#d96a2c} .dpri.Medium{background:#c79a3f} .dpri.Low{background:#b3ad9f}
  .dchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .dwho{margin:-12px 0 24px;padding:12px 14px;background:rgba(140,106,71,.07);border-radius:8px}
  .dwho-ig{display:inline-flex;align-items:center;gap:6px;color:var(--bronze);text-decoration:none;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em}
  .dwho-ig:hover{color:var(--ink)}
  .dwho-note{font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--slate);margin:8px 0 0;white-space:pre-wrap}
  .ig-wrap{display:flex;align-items:center;position:relative}
  .ig-wrap .ig-at{position:absolute;left:13px;color:#a8a294;font-size:14px;pointer-events:none}
  .ig-wrap input{padding-left:25px;padding-right:34px;width:100%}
  .ig-wrap .ig-open{position:absolute;right:12px;color:#3a7bd5;display:flex;line-height:0;text-decoration:none}
  .ig-wrap .ig-open:hover{color:#2c63ad}
  /* ---------- Invoice studio ---------- */
  .ivs{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(30,26,22,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .ivs.on{display:flex}
  .ivs-win{width:95vw;height:95vh;background:var(--row-alt,#f6f2e8);border-radius:18px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(30,22,14,.35)}
  .ivs-head{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid rgba(43,38,34,.10);background:transparent}
  /* header: a sliding segmented control, and icon-only actions */
  .ivs-head .btn{border-radius:8px;width:40px;padding:0}
  .ivs-head .btn.plain{border-color:transparent;background:transparent}
  .ivs-head .btn.plain:hover{background:rgba(43,38,34,.07);border-color:transparent;color:var(--ink)}
  .ivs-head .btn.on{background:var(--notes,#C04722);border-color:transparent;color:#fff}
  .ivs-seg{position:relative;display:inline-flex;background:rgba(43,38,34,.07);border-radius:999px;padding:3px}
  .ivs-seg .seg-thumb{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--notes,#C04722);
    transition:transform .26s cubic-bezier(.2,.8,.2,1),width .26s cubic-bezier(.2,.8,.2,1)}
  .ivs-seg button{position:relative;z-index:1;border:none;background:transparent;cursor:pointer;padding:0 18px;height:30px;
    font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7c7568;transition:color .2s}
  .ivs-seg button.on{color:#fff}
  /* the archive is summoned, not permanent */
  .ivs-body{grid-template-columns:410px minmax(0,1fr) 0}
  .ivs-body .ivs-arc{display:none}
  .ivs-body.show-arc{grid-template-columns:410px minmax(0,1fr) 268px}
  .ivs-body.show-arc .ivs-arc{display:grid}
  /* fields read as writing on paper rather than boxes */
  /* where the foot note sits on the sheet */
  .note-pos{display:inline-flex;gap:2px;margin-top:7px;background:rgba(43,38,34,.05);border-radius:7px;padding:2px}
  .note-pos button{border:none;background:transparent;cursor:pointer;padding:5px 12px;border-radius:5px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8b8375;transition:.15s}
  .note-pos button:hover{color:var(--ink)}
  .note-pos button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(40,28,16,.10)}
  .ivs-h1{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6f6655}
  .ivs-num{font-family:var(--mono);font-size:12px;color:var(--notes,#C04722);letter-spacing:.06em}
  .ivs-head .sp{flex:1}
  .ivs-body{flex:1;display:grid;grid-template-columns:410px minmax(0,1fr) 268px;min-height:0}
  .ivs-form{overflow-x:hidden;overflow-y:auto;padding:18px;border-right:1px solid rgba(43,38,34,.10);display:grid;gap:13px;align-content:start}
  .ivs-preview{min-width:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(43,38,34,.05)}
  .ivs-sheets{width:100%;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
  .ivs-sheet{position:relative;flex:0 0 auto;border-radius:6px;box-shadow:0 8px 30px rgba(30,22,14,.18);background:#fff}
  .ivs-sheet canvas{display:block;border-radius:6px;width:100%;height:auto}
  .ivs-pending{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:#9b9488;opacity:0;transition:opacity .2s}
  .ivs-pending.on{opacity:1}
  .ivs-arc{overflow:auto;border-left:1px solid rgba(43,38,34,.10);padding:16px 14px;display:grid;gap:8px;align-content:start}
  .ivs-arc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .ivs-arc-head .t{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9b9488}
  .ivs-card{border:1px solid rgba(43,38,34,.09);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s}
  .ivs-card:hover{box-shadow:0 4px 14px rgba(40,28,16,.10);transform:translateY(-1px)}
  .ivs-card.on{border-color:var(--notes,#C04722)}
  .ivs-card .n{font-family:var(--mono);font-size:11px;color:var(--notes,#C04722)}
  .ivs-card .w{font-family:var(--sans);font-size:13px;color:var(--ink);margin:2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ivs-card .f{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:#9b9488}
  .ivs-grid{position:absolute;inset:0;background:var(--row-alt,#f6f2e8);display:none;flex-direction:column;padding:18px 22px}
  .ivs-grid.on{display:flex}
  .ivs-gtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .ivs-gtop input{flex:1;max-width:340px;font-family:var(--sans);font-size:13.5px;padding:8px 12px;
    border:1px solid rgba(43,38,34,.16);border-radius:8px;background:#fff}
  .ivs-gtop select{font-family:var(--sans);font-size:12.5px;padding:8px 10px;border:1px solid rgba(43,38,34,.16);border-radius:8px;background:#fff}
  .ivs-gwrap{flex:1;overflow:auto}
  .ivs-gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .ivs-empty{color:#9b9488;font-family:var(--serif-soul);font-style:italic;font-size:15px;padding:30px 0}
  /* the archive narrows before it ever disappears */
  /* the third column only exists once the archive is open, at any width */
  @media(max-width:1320px){
    .ivs-body{grid-template-columns:386px minmax(0,1fr) 0}
    .ivs-body.show-arc{grid-template-columns:386px minmax(0,1fr) 218px}
  }
  @media(max-width:1080px){
    .ivs-body{grid-template-columns:366px minmax(0,1fr) 0}
    .ivs-body.show-arc{grid-template-columns:300px minmax(0,1fr) 200px}
  }

  /* ---------- Invoice maker ---------- */
  .inv-form{display:grid;gap:14px}
  .inv-kinds{display:flex;gap:8px}
  .inv-kinds button{flex:1;height:36px;border:1px solid rgba(43,38,34,.18);background:transparent;border-radius:8px;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7c7568;transition:.15s}
  .inv-kinds button.on{background:var(--notes,#C04722);border-color:transparent;color:#fff}
  .inv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .inv-form label,.ivs-form label{display:block;font-family:var(--sans);font-size:11.5px;color:#8b8375;margin-bottom:4px}
  .inv-form input,.inv-form textarea,.ivs-form input,.ivs-form textarea{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:13.5px;padding:8px 10px;
    border:1px solid rgba(43,38,34,.16);border-radius:7px;background:#fff;color:var(--ink)}
  .inv-lines{display:grid;gap:7px}
  .inv-line{display:grid;grid-template-columns:minmax(0,1fr) 56px 20px;gap:8px;align-items:center}
  .li-main{display:flex;align-items:stretch;border:1px solid rgba(43,38,34,.16);border-radius:7px;background:#fff;overflow:hidden;height:36px}
  .li-main:focus-within{border-color:rgba(43,38,34,.34)}
  .li-qty{display:flex;align-items:center;padding:0 3px 0 9px;font-family:var(--mono);font-size:12.5px;color:var(--ink);
    background:rgba(43,38,34,.045);white-space:nowrap;user-select:none}
  .li-steps{display:flex;flex-direction:column;justify-content:center;background:rgba(43,38,34,.045);padding-right:6px;gap:1px}
  .li-steps button{width:14px;height:12px;border:none;background:transparent;cursor:pointer;color:#8b8375;
    font-size:8px;line-height:1;padding:0;display:flex;align-items:center;justify-content:center}
  .li-steps button:hover{color:var(--ink)}
  .li-main .dsc{border:none;border-radius:0;height:100%;padding-left:9px}
  .li-price{display:flex;align-items:center;border:1px solid rgba(43,38,34,.16);border-radius:7px;background:#fff;height:36px;overflow:hidden}
  .li-price:focus-within{border-color:rgba(43,38,34,.34)}
  .li-price .cur{padding:0 1px 0 6px;font-family:var(--mono);font-size:11.5px;color:#8b8375}
  .li-price .unit{border:none;border-radius:0;height:100%;padding:0 5px 0 1px;font-family:var(--mono);font-size:11.5px}
  .inv-qty{display:flex;align-items:center;border:1px solid rgba(43,38,34,.16);border-radius:7px;background:#fff;overflow:hidden;height:35px}
  .inv-qty button{width:26px;height:100%;border:none;background:transparent;cursor:pointer;color:#8b8375;font-size:15px;line-height:1}
  .inv-qty button:hover{background:rgba(43,38,34,.06);color:var(--ink)}
  .inv-qty input{border:none;text-align:center;padding:0;font-family:var(--mono);font-size:13px;width:100%}
  .inv-del{border:none;background:transparent;color:#c9c2b4;cursor:pointer;font-size:17px;line-height:1}
  .inv-del:hover{color:var(--notes,#C04722)}
  .inv-addline{justify-self:start;border:1px dashed rgba(43,38,34,.22);background:transparent;border-radius:7px;padding:6px 12px;
    cursor:pointer;font-family:var(--sans);font-size:12px;color:#8b8375}
  .inv-addline:hover{color:var(--ink);border-color:rgba(43,38,34,.4)}
  .inv-totals{border-top:1px solid rgba(43,38,34,.12);padding-top:12px;display:grid;gap:6px}
  .inv-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12.5px;color:#6f6655}
  .inv-row .lb{display:inline-flex;align-items:center;gap:7px}
  .inv-row .lb>span:first-child{display:inline-block;width:62px}
  .inv-row.grand{font-size:14px;color:var(--notes,#C04722);margin-top:8px;padding:9px 11px;
    background:rgba(43,38,34,.055);border-radius:8px}
  .inv-row .pct{width:46px;text-align:right;font-family:var(--mono);font-size:12.5px;padding:3px 6px;
    border:1px solid rgba(43,38,34,.16);border-radius:5px;background:#fff}
  .ivs-win .ivs-form .note-f{background:#fff;border-color:transparent;color:#8b8375;font-style:italic}
  .ivs-form .note-f:hover{border-color:rgba(43,38,34,.16);background:#fff}
  .ivs-form .note-f:focus{border-color:rgba(43,38,34,.34);background:#fff;color:var(--ink);font-style:normal}
  .inv-num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9b9488}
  .inv-list{display:grid;gap:2px;max-height:320px;overflow:auto}
  .inv-item{display:grid;grid-template-columns:74px 1fr 92px 88px;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;cursor:pointer}
  .inv-item:hover{background:rgba(43,38,34,.045)}
  .inv-item .n{font-family:var(--mono);font-size:11.5px;color:var(--notes,#C04722)}
  .inv-item .w{font-family:var(--sans);font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inv-item .d,.inv-item .t{font-family:var(--mono);font-size:11.5px;color:#8b8375;text-align:right}
  /* fields read as writing on paper rather than boxes (declared after the shared rule) */
  .ivs-win .ivs-form input{border-color:transparent;background:#fff}
  .ivs-win .ivs-form input:hover{border-color:rgba(43,38,34,.12)}
  .ivs-win .ivs-form input:focus{background:#fff;border-color:rgba(43,38,34,.34);outline:none}
  .ivs-win .ivs-form .li-main,.ivs-win .ivs-form .li-price{border-color:transparent;background:#fff}
  .ivs-win .ivs-form .li-main:hover,.ivs-win .ivs-form .li-price:hover{border-color:rgba(43,38,34,.12)}
  .ivs-win .ivs-form .li-main:focus-within,.ivs-win .ivs-form .li-price:focus-within{border-color:rgba(43,38,34,.34)}
  .ivs-win .ivs-form .li-qty,.ivs-win .ivs-form .li-steps{background:rgba(43,38,34,.045)}
  /* Guidance panel in the draft modal: what to do before this email goes out */
  .dtips{margin:-6px 0 22px;padding:13px 15px 14px;background:rgba(162,84,58,.07);border-radius:8px;border-left:2px solid rgba(162,84,58,.35)}
  .dtips-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#a2543a;margin-bottom:8px}
  .dtips ul{margin:0;padding-left:16px}
  .dtips li{font-family:var(--sans);font-size:12.6px;line-height:1.5;color:var(--slate);margin-bottom:5px}
  .dtips li:last-child{margin-bottom:0}
  .dtips li b{color:var(--ink);font-weight:600}
  .dchip{display:inline-flex;align-items:center;border:.75px solid #a09b91;color:#a09b91;border-radius:999px;padding:2px 12px;font-family:var(--sans);font-size:7pt;letter-spacing:.12em;text-transform:uppercase;background:transparent;white-space:nowrap}
  .dfield{position:relative}
  .dfield .dcopy{position:absolute;top:10px;right:8px;border:none;background:none;cursor:pointer;color:#9c948a;line-height:1;padding:2px;transition:color .15s;display:flex}
  .dfield .dcopy:hover{color:#000}

  /* ---------- Edit form ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;padding:8px 44px 10px}
  .form-grid .fg{display:flex;flex-direction:column}
  .form-grid .fg.full{grid-column:1/-1}
  .form-grid label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
  .form-grid textarea{resize:vertical;min-height:76px}
  /* prefilled fields rest as quiet text; focus wakes the normal field chrome */
  .card .quiet:not(:focus){background:rgba(255,255,255,.31);border-color:transparent;color:#46413a;cursor:pointer}
  .card select.quiet:not(:focus){background-image:none}
  .card .quiet:not(:focus):hover{border-color:var(--rule);background:rgba(255,255,255,.5);color:#000}
  .money-wrap{position:relative}
  .money-wrap .pfx{position:absolute;left:14px;top:0;height:40px;display:flex;align-items:center;color:#bdb8ac;pointer-events:none;font-size:15px}
  .money-wrap input{padding-left:26px;width:100%}
  .pbuild{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .pbuild .prow{position:relative;display:flex;flex:0 0 calc(33.333% - 6px);min-width:120px}
  .pbuild .prow .psel,.pbuild .prow .pcustom{flex:1;width:100%;min-width:0;padding-right:26px}
  .pbuild .pdel{position:absolute;right:28px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:none;background:transparent;color:#b8b0a0;font-size:19px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;border-radius:4px}
  .pbuild .pdel:hover{color:#c0392b}
  .pbuild .padd{height:40px;width:40px;flex:0 0 40px;border:1px solid var(--rule);background:transparent;color:var(--slate);font-size:18px;cursor:pointer;transition:.15s}

<script type="module">import * as D from "./supabase/functions/_shared/drafts.js"; window.MaconDrafts = D;</script>
<script>
const STORE = "macon_archive_v1";
const SIG_ORDER = {High:0, Med:1, Low:2, "":3};
const COLS = ["acc","name","email","first_contact","pieces","ltv","gift_self","first_buy",
  "last_buy","why","lives","details","signal","first_look","last_contact","story","notes","location","phone","photos","instagram"];
const PRODUCTS = ["Ren","Pip","Rebi","Ori","Zuma","Ibi","Milo","Yael","Eleph",
  "Caldera Arc","Sietch Ring","Lunar Canyon","Zuma Ring","Eclipse Ring","Meridian Egg","Ida's Wonder Horn","Starship Key"];
// Typical make + ship time per piece, in days. The first story ask fires lead_time + 14 (settle)
// days after the order date. Fill in real numbers as you learn them; anything unlisted uses LEAD_DEFAULT.
const LEAD_DEFAULT = 21;
const PIECE_LEAD = {
  // "Ren": 14, "Caldera Arc": 45, "Meridian Egg": 30,
};
function leadTime(piece){ return (piece && PIECE_LEAD[piece]!=null) ? PIECE_LEAD[piece] : LEAD_DEFAULT; }
// Totems carry character names; everything else in the catalog is worn (jewelry).
// Custom / unknown pieces default to the totem voice.
const CHARACTER_PIECES = ["Ren","Pip","Rebi","Ori","Zuma","Ibi","Milo","Yael","Eleph"];
function isJewelry(piece){
  if(!piece) return false;
  if(CHARACTER_PIECES.some(c=>c.toLowerCase()===piece.toLowerCase())) return false;
  return PRODUCTS.some(pr=>pr.toLowerCase()===piece.toLowerCase()) || /ring|arc|key|horn|cuff|band|pendant|necklace|earring/i.test(piece);
}
let viewMode = localStorage.getItem("macon_view") || "regular";
if(viewMode==="generous") viewMode="regular";
let page = 1;
let filterKey = "all";
let sortKey = null, sortDir = 1;
const LFILTERS = {
  all:    d=>true,
  vip:    d=>!!d.first_look,
  repeat: d=>countPieces(d.pieces)>=2,
  prospect: d=>isProspect(d),
  due:    d=>isDue(d)||isReconnectDue(d),
  story:  d=>d.story==="Yes",
};
const PAGE_SIZE = {compact:16, regular:9};

const SEED = [
  {acc:"M-001", name:"Nick Bryciewicz", email:"nick@example.com", first_contact:"Commission / word of mouth",
   pieces:"Custom totems (~100)", ltv:4200, first_buy:"2024-09", last_buy:"2025-03", gift_self:"Gift",
   why:"Wanted connection symbols to give to people in his life",
   lives:"Distributed to ~100 friends & collaborators",
   details:"Commissioned the original ~100 totems as connection symbols. The proof the collector model works.",
   signal:"High", first_look:true, last_contact:"2026-06-02", story:"Yes", notes:"Anchor case study. Treat as patron."},
  {acc:"M-014", name:"Maya", email:"maya@example.com", first_contact:"Instagram",
   pieces:"Ren, Pip", ltv:440, first_buy:"2025-01", last_buy:"2025-08", gift_self:"Self",
   why:"Drawn to the horse — said it felt like a steward",
   lives:"On her studio windowsill, morning light",
   details:"Ceramicist in Oregon. Bought a second piece after a hard year. Said Ren 'holds magic.'",
   signal:"High", first_look:true, last_contact:"2026-06-05", story:"Yes", notes:"Repeat buyer + emotional signal. Prime First Look."},
  {acc:"M-022", name:"James", email:"james@example.com", first_contact:"Friend referral (Maya)",
   pieces:"Lunar Canyon", ltv:370, first_buy:"2025-05", last_buy:"2025-05", gift_self:"Gift",
   why:"Engagement gift for his partner", lives:"Worn daily by his fiancée",
   details:"Getting married autumn 2026. Referred by Maya.",
   signal:"Med", first_look:false, last_contact:"2026-05-28", story:"Asked", notes:"Follow up after the wedding — provenance potential."},
];

let data = [];
let filter = "all";
let query = "";
let sb = null;
let synced = false;

/* ---------- Storage layer ---------- */
const local = {
  load(){ try{ const r=JSON.parse(localStorage.getItem(STORE)); if(Array.isArray(r)) return r; }catch(e){} return SEED.slice(); },
  save(){ localStorage.setItem(STORE, JSON.stringify(data)); }
};

async function boot(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data:{ session } } = await sb.auth.getSession();
    if(session) startSynced(); else showGate();
    sb.auth.onAuthStateChange((_e, s)=>{ if(s) startSynced(); else showGate(); });
  } else {
    data = local.load(); synced=false; setSync("local","Local mode"); renderAll();
  }
}
async function startSynced(){
  hideGate(); synced=true; setSync("on","Synced");
  await refresh();
  sb.channel("collectors-rt").on("postgres_changes",{event:"*",schema:"public",table:"collectors"},()=>refresh()).subscribe();
  loadTodoDone(); loadInquiries().then(()=>{ renderDrawer(); renderLetters(); if(tab==="enquiries") renderEnquiries(); });
  loadLetterFonts();
  sb.channel("todos-rt").on("postgres_changes",{event:"*",schema:"public",table:"bureau_todos"},()=>loadTodoDone()).subscribe();
  sb.channel("inq-rt").on("postgres_changes",{event:"*",schema:"public",table:"inquiries"},()=>loadInquiries().then(()=>{ renderDrawer(); if(tab==="enquiries") renderEnquiries(); })).subscribe();
  initChat();
}
async function refresh(){
  if(!synced){ data=local.load(); renderAll(); return; }
  const { data:rows, error } = await sb.from("collectors").select("*").order("acc");
  if(error){ setSync("local","Sync error — check setup"); return; }
  data = rows || []; renderAll();
}
async function persist(rec, isNew){
  if(num(rec.ltv)>1000) rec.first_look=true;
  if(!synced){
    if(isNew) data.push(rec); else { const i=data.findIndex(d=>d.acc===rec.acc); if(i>=0) data[i]=rec; }
    local.save(); renderAll(); return;
  }
  const payload={}; COLS.forEach(c=>payload[c]=rec[c]); if(rec.id) payload.id=rec.id;
  const { error } = await sb.from("collectors").upsert(payload,{onConflict: rec.id?"id":"acc"});
  if(error) alert("Could not save: "+error.message);
  await refresh();
}
async function removeRec(rec){
  if(!synced){ data=data.filter(d=>d.acc!==rec.acc); local.save(); renderAll(); return; }
  const q = rec.id ? sb.from("collectors").delete().eq("id",rec.id) : sb.from("collectors").delete().eq("acc",rec.acc);
  const { error } = await q; if(error) alert("Could not remove: "+error.message);
  await refresh();
}

function countPieces(p){ if(!p||!p.trim()) return 0; return p.split(",").map(s=>s.trim()).filter(Boolean).length; }
function nextAcc(){
  let max=0; data.forEach(d=>{ const m=/M-(\d+)/.exec(d.acc||""); if(m) max=Math.max(max,+m[1]); });
  return "M-"+String(max+1).padStart(3,"0");
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function num(v){ const n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
function fmtMoney(v){ const n=num(v); return v==null||v===""?"" : "$"+n.toLocaleString("en-US",{maximumFractionDigits:0}); }
function capPieces(s){ s=s||""; return s.length>20 ? s.slice(0,20).replace(/[ ,]+$/,"")+"…" : s; }
function setSync(cls,txt){ const el=document.getElementById("sync"); el.className="sync "+cls; document.getElementById("syncTxt").textContent=txt; }

/* ---------- Render dashboard ---------- */
let prevStats=null;
// True collector: repeat (2+ pieces) AND bought within the last 18 months.
// One-time recent buyers are prospects (the cultivation pool); repeat-but-quiet are lapsed.
const RECENT_DAYS = 548; // ~18 months
function isRecent(d){ const n=daysSince(d.last_buy); return n!=null && n<=RECENT_DAYS; }
function isTrueCollector(d){ return countPieces(d.pieces)>=2 && isRecent(d); }
function isProspect(d){ return countPieces(d.pieces)<2 && isRecent(d); }
function isLapsed(d){ return countPieces(d.pieces)>=2 && !isRecent(d); }
function renderDash(){
  const total=data.length;
  const fl=data.filter(d=>d.first_look).length;
  const repeat=data.filter(d=>countPieces(d.pieces)>=2).length;
  const stories=data.filter(d=>d.story==="Yes").length;
  const ltvSum=data.reduce((s,d)=>s+num(d.ltv),0);
  const avgVal=total? "$"+Math.round(ltvSum/total).toLocaleString("en-US") : "$0";
  const trueN=data.filter(isTrueCollector).length;
  const prospects=data.filter(isProspect).length;
  const lapsed=data.filter(isLapsed).length;
  const pct=Math.min(100, Math.round(trueN/200*100));
  const stats=[
    {k:"truecollectors", v:trueN,     l:"True Collectors"},
    {k:"prospects",      v:prospects, l:"Prospects"},
    {k:"repeat",         v:repeat,    l:"Repeat Collectors"},

function daysSince(str){ const t=Date.parse(str); return isNaN(t)?null:Math.floor((Date.now()-t)/86400000); }
function fmtDate(str){ const t=Date.parse(str); if(isNaN(t)) return str||""; const d=new Date(t);
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function firstName(n){ return (n||"").trim().split(/\s+/)[0]||"there"; }
function firstPiece(p){ return ((p||"").split(",")[0]||"").trim().replace(/\s*[×x]\d+$/,""); }
/* Kept in step with functions/followup-digest/index.ts. A story ask belongs to a
   recent purchase; past STORY_WINDOW it stops being one, which is what turned
   the digest into all 94 collectors at once. */
const STORY_WINDOW=180, PATRON_LTV=600;
function isDue(d){
  const days=daysSince(d.last_buy);
  if(days==null) return false;
  if(days < leadTime(firstPiece(d.pieces)) + 14) return false;   // make + ship, then settle
  if(days > STORY_WINDOW) return false;          // too long ago to ask how it settled in
  if(d.story==="Yes") return false;              // story already captured
  if(d.last_contact){ const c=daysSince(d.last_contact);
    if(c!=null && c<21) return false; }          // snooze: resurface ~3 weeks after a no-reply
  return true;
}
function isReconnectDue(d){
  // follows value, not just the VIP flag: the patrons above PATRON_LTV are half
  // of all revenue and are the ones worth never losing touch with
  if(!d.first_look && num(d.ltv) < PATRON_LTV) return false;
  if(isDue(d)) return false;                     // a live story ask takes precedence
  const last = d.last_contact ? daysSince(d.last_contact) : daysSince(d.last_buy);
  return last!=null && last>=90;
}

function followScore(d){ let s=0; if(d.first_look)s+=3; if(num(d.ltv)>1000)s+=2; if(countPieces(d.pieces)>=2)s+=1; if(d.gift_self==="Gift")s+=1; return s; }
function followPriority(d){ const s=followScore(d); return s>=3?"High":s>=1?"Medium":"Low"; }
function followAsk(d){
  const piece=firstPiece(d.pieces)||"your piece";
  const jewel=isJewelry(piece);
  if(d.gift_self==="Gift") return jewel
    ? `Did the person you gave ${piece} to put it on right away?`
    : `Did the person you gave ${piece} to understand what it was without being told?`;
  if(countPieces(d.pieces)>=2) return `What made you choose ${piece} over the others?`;
  if(d.first_look) return jewel
    ? `How does ${piece} feel to wear — has it worked its way into the rotation?`
    : `Where does ${piece} live now — and what's it come to mean to you?`;
  return jewel
    ? `Has ${piece} been getting out into the world with you — where's it been worn?`
    : `Where does ${piece} live now — on you, on a shelf, somewhere specific?`;
}
function followType(d, kind){
  if(kind==="reconnect") return "Reconnect";
  if(d.gift_self==="Gift") return "Gift recipient story";
  if(d.first_look) return "VIP check-in";
  if(countPieces(d.pieces)>=2) return "Collector check-in";

}
function followKey(d, kind){
  if(kind==="custom") return "custom";
  if(kind==="reconnect") return "reconnect";
  if(d.gift_self==="Gift") return "gift";
  if(d.first_look) return "vip";

  const STAR = I('<path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5 20.4l1.4-6.8L1.3 9l6.9-.7z"/>');
  const GEM  = I('<path d="M6 3h12l3 6-9 12L3 9z"/>');
  const GIFT = I('<path d="M20 7h-2.3a3 3 0 1 0-5.7-1 3 3 0 1 0-5.7 1H4a1 1 0 0 0-1 1v3h18V8a1 1 0 0 0-1-1zM3 13v6a1 1 0 0 0 1 1h7v-7H3zm10 7h7a1 1 0 0 0 1-1v-6h-8v7z"/>');
  const SPARK= I('<path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/>');

function clientType(d){ if(d.first_look||num(d.ltv)>1000) return "VIP"; if(countPieces(d.pieces)>=2) return "Collector"; if(d.gift_self==="Gift") return "Gift"; return "New"; }
function followAction(d, kind){ if(kind==="custom") return "Custom inquiry"; if(kind==="reconnect") return "Reconnect"; if(d.gift_self==="Gift") return "Gift story"; if(num(d.ltv)>1000 && !(countPieces(d.pieces)>=2)) return "Welcome"; if(countPieces(d.pieces)>=2||d.first_look) return "Check-in"; return "Story request"; }
function cardMeta(d, kind, q){
  if(kind==="custom"){
    const when = q && q.last_touched ? "followed up "+daysSince(q.last_touched)+"d ago" : "no reply yet";
    const flag = q && q.draft ? '  ·  <span class="fdraft">draft ready</span>' : "";
    return 'Enquiry  ·  <span class="fmeta-dim">'+esc((q&&q.subject)||"")+"  ·  "+when+"</span>"+flag;

}
function cardMetaStd(d, kind){ const np=countPieces(d.pieces); const rest=[ np>1?(np+" pieces"):firstPiece(d.pieces), fmtMoney(d.ltv) ].filter(Boolean).map(esc); const a=esc(followAction(d,kind)); return rest.length ? a+'  ·  <span class="fmeta-dim">'+rest.join("  ·  ")+"</span>" : a; }
function shortName(n){ n=(n||"").trim(); if(!n) return "—"; const p=n.split(/\s+/).filter(Boolean); if(p.length<2) return p[0]; const last=p[p.length-1]; return p[0]+" "+last[0].toUpperCase()+"."; }
function followSummary(d, kind){
  const piece=esc(firstPiece(d.pieces)||"their piece");

    case "repeat":    return "A returning collector. Ask what keeps pulling them back.";
    case "value":     return `A big first purchase. A warm thank-you and a story ask.`;

}
/* The letters live in drafts.js so the archive and the weekly digest read the
   same words. Loaded as a module below and read lazily, by which time it is in. */
const D = () => window.MaconDrafts;
const emailCtx = d => D().emailCtx(d);
// Reconnect: presence only, no ask — just "you're on our minds"
function draftEmail(d, tone, kind, q, signoff){
  let set = kind==="custom" ? D().CUSTOM_TONES : kind==="reconnect" ? D().RECON_TONES : D().TONES;
  if(kind==="custom" && q && q.draft)
    set = [{name:"Prepared", build:x=>({subject:x.subject||"Your commission", body:x.draft})}].concat(set);
  const n=set.length, idx=((tone|0)%n+n)%n;
  const r=set[idx].build(kind==="custom" ? q : emailCtx(d));
  // A hand-written prepared letter has no placeholder to fill; every
  // generated tone does, and defaults to Alex when no signoff is chosen.
  const body = String(r.body||"").split("{{SIGNOFF}}").join(signoff||"Alex");
  // Three to five words, whichever tone or template produced it.
  const short = D().shortSubject || (x=>x);
  return {subject:short(r.subject), body, toneName:set[idx].name, toneIdx:idx};
}
/* ---------- Custom enquiries ----------
   Records, not tasks. They live in public.inquiries and carry a status, so a
   tick advances them rather than erasing them. What "needs attention" means is
   worked out here from status plus time and is never written down: that is what
   makes it impossible for a click to lose someone. */

const INQ_STALE_DAYS = 7;      // a followed-up thread goes quiet this long, it resurfaces
let inquiries = [];

async function loadInquiries(){
  if(!(synced&&sb)) return;
  const { data:rows, error } = await sb.from("inquiries").select("*").order("first_seen",{ascending:true});
  if(!error) inquiries = rows||[];
}
function inqState(q){
  if(q.status==="closed") return "closed";
  if(q.status==="open")   return "attention";
  const since = q.last_touched ? daysSince(q.last_touched) : daysSince(q.first_seen);
  return since >= INQ_STALE_DAYS ? "attention" : "followed";
}
function inqAsD(q){ return {name:q.name, email:q.email||"", pieces:"Custom", ltv:"", notes:q.note,
  location:"", instagram:"", last_buy:"", last_contact:q.last_touched||q.first_seen}; }

async function inqSet(id, patch){
  const q = inquiries.find(x=>x.id===id); if(!q) return;
  Object.assign(q, patch);
  renderDrawer(); if(tab==="enquiries") renderEnquiries();
  if(synced&&sb){ try{ await sb.from("inquiries").update(patch).eq("id",id); }catch(e){} }
}
// Following someone up stamps the date and moves them on. It never removes them.
function inqFollowUp(id){
  return inqSet(id, { status:"followed", last_touched:new Date().toLocaleDateString("en-CA") });
}
async function inqAdd(){
  const name = prompt("Who wrote in?"); if(!name) return;
  const subject = prompt("What did they ask for?") || "";

function followUps(){
  const P={High:0,Medium:1,Low:2};
  const story=data.map((d,i)=>({d,i})).filter(x=>isDue(x.d))
    .map(x=>({...x, kind:"story", days:daysSince(x.d.last_buy), priority:followPriority(x.d), ask:followAsk(x.d), state:"attention"}));
  const recon=data.map((d,i)=>({d,i})).filter(x=>isReconnectDue(x.d))
    .map(x=>({...x, kind:"reconnect", days:(x.d.last_contact?daysSince(x.d.last_contact):daysSince(x.d.last_buy)), priority:"High", ask:"", state:"attention"}));
  // spoken to lately: not due, but still visible under Followed up rather than gone
  const RECENT=45;
  const warm=data.map((d,i)=>({d,i}))
    .filter(x=>x.d.last_contact && daysSince(x.d.last_contact)<RECENT && !isDue(x.d) && !isReconnectDue(x.d))
    .map(x=>({...x, kind:"story", days:daysSince(x.d.last_contact), priority:"Low", ask:"", state:"followed"}));
  // open custom inquiries lead the drawer: live money, and the thread goes cold fastest
  const inq=inquiries.map(q=>({d:inqAsD(q), i:-1, q, kind:"custom",
    days:daysSince(q.last_touched||q.first_seen), priority:"High", ask:"", state:inqState(q)}));
  return inq.concat(story, recon, warm).sort((a,b)=>
    (a.kind==="custom"?0:1)-(b.kind==="custom"?0:1) || P[a.priority]-P[b.priority] ||
    // enquiries lead with the most overdue; collector cards keep soonest-first
    (a.kind==="custom" && b.kind==="custom" ? b.days-a.days : a.days-b.days));
}

function flipLedger(render){
  const host=document.getElementById("ledger");
  if(!host){ render(); return; }
  const first={};
  host.querySelectorAll(".entry").forEach(el=>{ first[el.dataset.i]=el.getBoundingClientRect().top; });
  render();
  if(typeof Element==="undefined" || !Element.prototype.animate){ return; }
  const MOVE_DUR=240, incoming=[]; let hasMoved=false;
  host.querySelectorAll(".entry").forEach(el=>{
    const ft=first[el.dataset.i], lt=el.getBoundingClientRect().top;
    if(ft!=null){ const dy=ft-lt;
      if(Math.abs(dy)>0.5){ hasMoved=true; el.animate([{transform:`translateY(${dy}px)`},{transform:"translateY(0)"}],{duration:MOVE_DUR,easing:"cubic-bezier(.2,.8,.2,1)"}); }
    } else { incoming.push(el); }
  });
  if(!incoming.length) return;
  // Stagger new rows up from below, overlapping the reposition slightly so the
  // whole page settles within ~0.5s.
  incoming.forEach(el=>{ el.style.visibility="hidden"; });
  const base=hasMoved?120:0, DUR=180, RUN=500-base-DUR;
  const step=incoming.length>1 ? Math.max(20,RUN/(incoming.length-1)) : 0;
  incoming.forEach((el,k)=>{
    setTimeout(()=>{
      el.style.visibility="";
      el.animate([{opacity:0,transform:"translateY(22px)"},{opacity:1,transform:"translateY(0)"}],{duration:DUR,easing:"cubic-bezier(.2,.8,.2,1)"});
    }, base + k*step);
  });
}

// ("ARTIFACT", "AMT.") — full sentences exercise glyphs that may not exist in
// the file, and a missing glyph doesn't error, it silently substitutes the
// next font in the stack FOR JUST THAT CHARACTER: "letters mismatched within
// a word."
//
// A canvas width-comparison approach (measure a character against a
// monospace baseline, flag it as missing if the widths match) was tried and
// reverted: tested live against Gabriele Light, a font already confirmed
// working, it flagged nearly every letter as missing — plenty of real glyphs
// in a normal proportional font coincidentally share a monospace font's fixed
// cell width, so the technique produces false positives, not real signal.
//
// Reliable detection needs either an actual font-parsing library (reading the
// font's own glyph table) or a human reporting which characters break. Until
// one of those exists, this is a manually-maintained list: known bad
// characters get force-switched to the safe serif for the whole string,
// rather than half-rendering in a mismatched font.
// The studio fonts are subsets: Birdie ships 33 characters (no H J K Q W X Y

    if(String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3))==="cmap") cmap=dv.getUint32(o+8);

  for(let i=0,n=dv.getUint16(cmap+2);i<n;i++){
    const sub=cmap+dv.getUint32(cmap+4+i*8+4), fmt=dv.getUint16(sub);
    if(fmt===4){
      const segX2=dv.getUint16(sub+6), ends=sub+14, starts=ends+segX2+2;
      for(let s=0;s<segX2/2;s++){
        const e=dv.getUint16(ends+s*2), st=dv.getUint16(starts+s*2);
        for(let c=st;c<=e&&c!==0xFFFF;c++) have.add(c);
      }

      for(let g=0,ng=dv.getUint32(sub+12);g<ng;g++){
        const b=sub+16+g*12;
        for(let c=dv.getUint32(b),e=dv.getUint32(b+4);c<=e;c++) have.add(c);
      }

}

// The badge and compose button ride the sheet's own top-right corner.

// one take the same beat.

  const text = isField ? el.value : el.textContent;
  const set = v => { if(isField) el.value=v; else el.textContent=v; };
  if(!text || matchMedia("(prefers-reduced-motion: reduce)").matches){ resize && resize(); done && done(); return; }

  const t0 = performance.now();
  set(""); resize && resize();

    const q=Math.min((n-t0)/dur,1);
    const e=1-Math.pow(1-q,2);

    resize && resize();
    if(p<1) return requestAnimationFrame(erase);
    const t1=performance.now();
    (function write(n){
      const q=Math.min((n-t1)/WRITE,1);

      const e=1-Math.pow(1-q,2);
      el.value=next.slice(0, Math.round(next.length*e));
      resize && resize();
      if(q<1) requestAnimationFrame(write); else { el.value=next; resize && resize(); done && done(); }
    })(performance.now());

/* The To field was a fixed 24ch, which cut long addresses off mid-word. It is

function autosizeTo(el){

function placeLetterTopbar(){

// Sent through the API rather than a compose window, so a reply carries the
// original thread id and In-Reply-To and lands inside the conversation the
// customer already has. Falls back to a compose window if the box cannot send.
async function sendLetter({subj, body, to}){
  const {from,cc}=letterFrom();
  const t=readerThread;
  const inThread = t && t.box===from && t.threadId;
  const btn=document.getElementById("lvSend");
  if(btn){ btn.disabled=true; btn.textContent="Sending…"; }
  try{
    const { data:{ session } }=await sb.auth.getSession();
    if(!session) throw new Error("not signed in");
    const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/gmail-reader?action=send`,{
      method:"POST",
      headers:{ Authorization:"Bearer "+session.access_token, apikey:CONFIG.SUPABASE_ANON_KEY, "Content-Type":"application/json" },
      body:JSON.stringify({ mailbox:from, to, cc, subject:subj, body,
        threadId: inThread?t.threadId:"", inReplyTo: inThread?t.inReplyTo:"", references: inThread?(t.references||t.inReplyTo):"" })
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||("send failed ("+r.status+")"));
    if(btn){ btn.textContent="Sent"; }
    try{ localStorage.removeItem("macon.draft"); }catch{}

  }catch(e){

    // Hold the text so a reload or a stray re-render cannot lose it.
    try{ localStorage.setItem("macon.draft", JSON.stringify({to, subj, body, at:Date.now()})); }catch{}
    // A compose window is the honest fallback: nothing was sent, and the
    // letter is not lost.
    const g=new URL("https://mail.google.com/mail/");
    g.searchParams.set("authuser",from); g.searchParams.set("view","cm"); g.searchParams.set("fs","1");
    g.searchParams.set("to",to); g.searchParams.set("su",subj); g.searchParams.set("body",body);
    if(cc) g.searchParams.set("cc",cc);
    if(confirm("Could not send from the app: "+e.message+"\n\nOpen a Gmail compose window instead?")) window.open(g.toString(),"_blank","noopener");
    return false;

}

/* ---------- making a raw plain-text mail readable ----------
   Mail arrives hard-wrapped at 72 columns, trailing a quoted copy of the whole
   previous thread and a signature. Rendered literally it is a wall. Three
   passes fix it: honour RFC 3676 format=flowed where the sender marked it,
   heuristically rejoin hard-wrapped prose where they did not, and fold the
   quoted history and signature away. */

// RFC 3676: a line ending in a space is a soft break and joins the next.
function mailFlowed(text, delsp){
  const out=[]; let buf="", depth=null;
  for(const raw of String(text).split("\n")){
    const m=/^(>*)\s?([\s\S]*)$/.exec(raw);
    const d=m[1].length, line=m[2];
    if(depth!==null && d!==depth){ out.push({d:depth, t:buf}); buf=""; }
    depth=d;
    if(/ $/.test(line)){ buf += delsp ? line.slice(0,-1) : line; }
    else { buf += line; out.push({d, t:buf}); buf=""; depth=null; }
  }
  if(buf) out.push({d:depth||0, t:buf});
  return out.map(o=>(o.d?">".repeat(o.d)+" ":"")+o.t).join("\n");
}

// Everything from "-- " onward is a signature and must keep its own breaks.
function mailSplitSignature(text){
  const m=/^-- ?$/m.exec(text);
  if(!m) return { body:text, sig:"" };
  return { body:text.slice(0, m.index).replace(/\s+$/,""), sig:text.slice(m.index+m[0].length).replace(/^\n/,"") };
}

const QUOTE_MARKERS=[
  /^-{2,}\s*Original Message\s*-{2,}/im,
  /^-{2,}\s*Forwarded message\s*-{2,}/im,
  /^_{5,}\s*$/m,
  /^From:\s.+\nSent:\s/im,
];
// Walk back from the end: the "On <date>, X wrote:" preamble belongs to the
// quote, not to the message.
function mailSplitQuote(text){
  const lines=text.split("\n");
  let cut=-1;
  for(const re of QUOTE_MARKERS){ const m=re.exec(text); if(m){ const i=text.slice(0,m.index).split("\n").length-1; if(cut<0||i<cut) cut=i; } }
  if(cut<0){
    for(let i=0;i<lines.length;i++){
      if(/^>/.test(lines[i])){ cut=i; break; }
    }
    // pull the "On ... wrote:" line (and its wrapped first half) into the quote
    if(cut>0){
      let j=cut-1;
      while(j>=0 && lines[j].trim()==="") j--;
      if(j>=0 && /wrote:\s*$/.test(lines[j])){
        cut=j;
        if(cut>0 && /^On\s/.test(lines[cut])===false && /^On\s/.test(lines[cut-1])) cut=cut-1;
      }
    }
  }
  if(cut<0) return { body:text, quoted:"" };
  const body=lines.slice(0,cut).join("\n").replace(/\s+$/,"");
  const quoted=lines.slice(cut).join("\n").trim();
  // A quote with nothing above it is the whole message: show it.
  if(!body.trim()) return { body:text, quoted:"" };
  return { body, quoted };
}

// Rejoin prose that a 72-column composer broke, and leave everything that
// depends on its line breaks alone.
function mailUnwrap(text){
  return String(text).replace(/\r\n/g,"\n").split(/\n{2,}/).map(block=>{
    const lines=block.split("\n");
    if(lines.length<3) return {pre:false, t:block};
    const max=Math.max(...lines.map(l=>l.length));
    const nonFinal=lines.slice(0,-1);
    const longish=nonFinal.filter(l=>l.length>=62).length;
    const wrapped = max<=80 && longish >= Math.ceil(nonFinal.length*0.6);
    const looksPre = lines.some(l=>/^\s{2,}\S/.test(l))
      || lines.filter(l=>/^\s*([-*\u2022]|\d+[.)])\s/.test(l)).length>=2
      || lines.some(l=>/\S {3,}\S/.test(l));
    if(!wrapped || looksPre) return {pre:true, t:block};
    let out="";
    lines.forEach((l,i)=>{
      out += l;
      if(i===lines.length-1) return;
      const next=lines[i+1];
      out += (/^\s*([-*\u2022]|\d+[.)])\s/.test(next) || /:$/.test(l)) ? "\n" : " ";
    });
    return {pre:false, t:out};
  });
}

const URL_RE=/\bhttps?:\/\/[^\s<>"')]+/g;
function mailLinkify(escaped){
  return escaped.replace(URL_RE, u=>{
    const clean=u.replace(/[.,;:]$/,"");
    let label=clean.replace(/^https?:\/\//,"");
    if(label.length>34) label=label.slice(0,32)+"\u2026";
    return `<a href="${clean}" target="_blank" rel="noopener" title="${clean}">${label}</a>`;
  });
}

// Marketing mail and long forwards arrive with quote markers scattered through
// every line. Strip the leading chains, drop the lines that are nothing but
// markers, and collapse what is left, or no amount of unwrapping will help.
function mailDequote(t){
  return String(t||"")
    .split("\n")
    .map(l=>l.replace(/^\s*(?:>\s*)+/,""))
    .filter(l=>!/^\s*(?:>|\|)?\s*$/.test(l) || true)
    .join("\n")
    .replace(/(?:^|\s)>(?=\s|$)/g," ")
    .replace(/[ \t]{2,}/g," ")
    .replace(/\n{3,}/g,"\n\n");
}
function mailRender(text){
  // Order matters: the quote detector reads the ">" markers, so the history has
  // to be split off before those markers are stripped.
  const { body, sig } = mailSplitSignature(String(text||""));
  const { body:main, quoted } = mailSplitQuote(body);
  const blocks = mailUnwrap(mailDequote(main)).map(b=>
    `<p class="${b.pre?"mm-pre":""}">${mailLinkify(esc(b.t))}</p>`).join("");
  return { html: blocks || "<p></p>", quoted: mailDequote(quoted), sig };
}

// Today shows a time, this week a weekday, this year a date, older adds a year.
function mailDate(ms){
  const d=new Date(ms), now=new Date();
  const sameDay=d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
  const days=(now-d)/86400000;
  if(days<7) return d.toLocaleDateString([], {weekday:"short"});
  if(d.getFullYear()===now.getFullYear()) return d.toLocaleDateString([], {month:"short", day:"numeric"});
  return d.toLocaleDateString([], {month:"short", day:"numeric", year:"numeric"});
}

// Sends the open conversation to the letter-writer function and gets back a
// subject and a body that answer it.
async function letterFromThread(t, x){
  const { data:{ session } }=await sb.auth.getSession();
  if(!session) throw new Error("connect");
  const d=x.d||{}, q=x.q||null;
  const mine=m=>/ma[\u00e7c]on/i.test(m.from||"") || MAILBOXES.some(b=>String(m.from||"").toLowerCase().includes(boxLabel(b)));
  const body={
    name: d.name||t.name||"", email: d.email||t.email||"",
    piece: (D().emailCtx ? D().emailCtx(d).piece : "") || (q?q.subject:"") || "",
    city: d.city||"", kind: x.kind||"", 
    messages: (t.msgs||[]).map(m=>({ from:m.from, at:m.at, mine:mine(m), body:m.body }))
  };
  const r=await fetch(`${CONFIG.SUPABASE_URL}/functions/v1/letter-writer`, {
    method:"POST",
    headers:{ Authorization:"Bearer "+session.access_token, apikey:CONFIG.SUPABASE_ANON_KEY, "Content-Type":"application/json" },
    body: JSON.stringify(body)
  });
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(typeof j.error==="string"?j.error:("writer "+r.status));
  const short = D().shortSubject || (v=>v);
  return { subject: short(j.subject), body: String(j.body||"") };
}

/* The second card pins the most recent thing THEY wrote, never our own reply,
   so the letter is written with their last words still on the desk. */
function renderPinnedMessage(){
  const host=document.getElementById("lettersView"); if(!host) return;
  const card=host.querySelector("#lvCard2"); if(!card) return;
  const t=readerThread;
  const ours=m=>/ma[\u00e7c]on/i.test(m.from||"") || MAILBOXES.some(b=>String(m.from||"").toLowerCase().includes(boxLabel(b)));
  const theirs=(t && t.msgs ? t.msgs.filter(m=>!ours(m)) : []);
  const last=theirs.length ? theirs[theirs.length-1] : null;
  if(!last){ card.hidden=true; placeLetterTopbar(); return; }
  const { body:b1 } = mailSplitSignature(String(last.body||""));
  const { body:main } = mailSplitQuote(b1);
  const text = mailDequote(main).replace(/\n{3,}/g,"\n\n").trim();
  if(!text){ card.hidden=true; placeLetterTopbar(); return; }
  card.querySelector(".lv-cnr-l").innerHTML=`They wrote<i>${esc(mailDate(last.at))}</i>`;
  card.querySelector(".lv-cnr-r").textContent="";

async function loadThreadFor(email, name){
  if(!email || !gmailReady()){ readerMode="post"; readerThread=null; renderPinnedMessage(); renderReader(); return; }
  readerMode="thread";
  readerOpenMsgs.clear();
  if(_threads.has(email)){ readerThread=_threads.get(email); renderPinnedMessage(); renderReader(); return; }
  readerThread={email, name, loading:true}; renderReader();
  try{
    const q=encodeURIComponent(`from:${email} OR to:${email}`);
    const boxes=(readerConnected&&readerConnected.length)?readerConnected:[];
    const perBox=await Promise.all(boxes.map(async box=>{
      try{
        const list=await gmail(`threads?q=${q}&maxResults=1`, box);
        if(!list.threads||!list.threads.length) return [];
        const t=await gmail(`threads/${list.threads[0].id}?format=full`, box);
        return (t.messages||[]).map(m=>({ box, from:cleanName(hdr(m,"From")),
          at:Number(m.internalDate), body:gmailPlainText(m.payload)||unent(m.snippet||""), subject:hdr(m,"Subject"),
          threadId:t.id, msgId:hdr(m,"Message-ID"), refs:hdr(m,"References") }));
      }catch(e){ return []; }
    }));
    // One conversation even when it crossed both boxes, de-duped where a
    // message was addressed to both and sorted oldest first.
    const seen=new Set();
    const msgs=perBox.flat().sort((a,b)=>a.at-b.at)
      .filter(m=>{ const k=m.at+"|"+m.from; if(seen.has(k)) return false; seen.add(k); return true; });
    const last = msgs.length ? msgs[msgs.length-1] : null;
    readerThread={email, name, msgs, box: last?last.box:"",
      threadId: last?last.threadId:"", inReplyTo: last?last.msgId:"", references: last?last.refs:""};
  }catch(e){ readerThread={email, name, msgs:[], err:e.message}; }
  if(readerThread.email===email) _threads.set(email, readerThread);
  renderPinnedMessage();
  renderReader();
}

/* A letter sent counts for a fortnight. Kept in localStorage rather than the
   database: it is a note to ourselves about this week, not a record. */
const SENT_BADGE_DAYS = 14;
function sentRecent(){
  let a=[]; try{ a=JSON.parse(localStorage.getItem("macon.sent")||"[]"); }catch{}
  const cut=Date.now()-SENT_BADGE_DAYS*86400000;
  const keep=a.filter(t=>Number(t)>cut);
  if(keep.length!==a.length){ try{ localStorage.setItem("macon.sent", JSON.stringify(keep)); }catch{} }
  return keep;
}
function noteSent(){
  const a=sentRecent(); a.push(Date.now());
  try{ localStorage.setItem("macon.sent", JSON.stringify(a)); }catch{}
}

function renderLetters(){
  const host=document.getElementById("lettersView"); if(!host) return;
  const all=followUps();
  // The urgent, per-letter view stops at 3 months — anything older still
  // needs attention, but it belongs in Classic's drawer, not the front page.
  letterQueue = all.filter(x=>(x.state||"attention")==="attention" && (x.days==null || x.days<=90));
  // Enquiries still lead (live money), then the collectors most worth an hour:
  // patrons and past commissioners, and anyone inside the repeat window.
  letterQueue.sort((a,b)=>{
    if((a.kind==="custom")!==(b.kind==="custom")) return a.kind==="custom"?-1:1;
    const fa=letterFlags(a), fb=letterFlags(b);
    const score=f=>(f.patron?4:0)+(f.commissioner?2:0)+(f.window?1:0);
    return score(fb)-score(fa);
  });
  if(letterIdx>=letterQueue.length) letterIdx=0;
  if(!letterQueue.length){
    host.innerHTML=`<div class="lv-empty">Nothing needs you right now.<br>Come back once someone's due, or switch to Classic to browse everyone.</div>`;
    return;
  }
  letterToneIdx=0; letterVaultOpen=false; letterTypeIn=true;
  renderCurrentLetter();
}

    </div>` : "";
  const factLine1 = facts.join(" · ");
  // The corner meta has about twenty characters before the two ends crowd, so
  // it carries the piece and a short date rather than the full fact line.
  const cardMeta = (()=>{
    const piece = facts[0] || "";
    const when = String(facts[1]||"").match(/[A-Z][a-z]{2}\s+\d{1,2},?\s*(\d{4})/);
    const short = when ? when[0].replace(/\s+\d{1,2},?\s*/, " ") : "";
    return [piece, short].filter(Boolean).join(" \u00b7 ");
  })();
  const factLine2 = ctx ? `Suggested tone: ${ctx.suggestedTone}` : "";

  // The margin quote IS an enquiry's note, editable in place — there is no
  // separate panel repeating it, so this is the only copy of that text.
  const quoteHTML = kind==="custom"

    : (quote?`<div class="lv-quote">${esc(quote)}</div>`:"");

  // A couple of blank sheets behind the real one, tilted, so the pile beneath
  // today's letters reads as an actual stack rather than a single page.
  const ghostCount = (composing || letterQueue.length<=3) ? 0 : 3;
  // Each letter has its own pile, seeded by where it sits in the queue, so it
  // is stable while you read and different the moment you move. The sheets
  // start the render wearing the previous letter's angles and are eased to
  // their own on the next frame, so the pile resettles rather than cutting.
  const ghostT = (()=>{
    let seed=(letterIdx+1)*2654435761 >>> 0;
    const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
    return Array.from({length:ghostCount}, ()=>{
      const rot=(rnd()*9-4.5).toFixed(2);
      const tx=Math.round(rnd()*40-20), ty=Math.round(8+rnd()*20);
      return `rotate(${rot}deg) translate(${tx}px,${ty}px)`;
    });
  })();
  const ghosts = ghostT.map((t,i)=>
    `<div class="lv-ghost" style="transform:${letterGhostPrev[i]||t};z-index:${-i}" data-t="${t}"></div>`).join("");

  host.innerHTML = `
    <div class="lv-scene">
      <div class="lv-mailbar" id="lvMailbar"></div>

      <div class="lv-cardstack" id="lvCards">
      <div class="lv-labelwrap"><div class="lv-label">

          <span class="lv-cnr-l" style="font-family:${safeFont("Gabriele Dark","var(--serif-soul)",ctx?ctx.kindLabel+ctx.priority:"")}">
            ${ctx?`<i>${esc(ctx.kindLabel)}</i><i class="lv-pri-${esc(ctx.priority.toLowerCase())}">${esc(ctx.priority)}</i>`:""}
          </span>

        </div>
        <div class="lv-name" id="lvCardName" style="font-family:${safeFont("TAY Flapjack","var(--serif-soul)",name)}">${(()=>{

        })()}</div>
        <div class="lv-noteblock">${quoteHTML}</div>
        ${composing||kind==="custom" ? "" : (letterFilingOpen ? `
        <form class="lv-file" id="lvFile">
          <label>What they said
            <textarea id="lvFileStory" rows="3" placeholder="Paste their words, verbatim">${esc(d.story||"")}</textarea></label>
          <label>Where it lives
            <input id="lvFileLives" value="${esc(d.lives||"")}" placeholder="On his desk in Surrey"></label>
          <label>Why they bought it

          <div class="lv-file-seg" role="group" aria-label="Gift or self">

          </div>

          ${flags.patron && d.phone ? `<a class="lv-call" href="tel:${esc(String(d.phone).replace(/[^0-9+]/g,""))}" title="Email replies run about 3 percent. Ring them instead.">Call ${esc((d.name||"").split(" ")[0]||"them")}</a>` : ""}

  loadThreadFor(email, name);

  // clicking the name cycles who signs — Alex, Hannah, or both — and simply
  // redraws the letter with the new choice baked in, the same way Tone does
  host.querySelector("#lvSignoff").onclick=e=>{
    letterSignoff = SIGNOFFS[(SIGNOFFS.indexOf(letterSignoff)+1)%SIGNOFFS.length];

  try{

    }
  }catch{}
  const nameEl=host.querySelector("#lvCardName");
  if(nameEl){
    fitCardName(nameEl);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>fitCardName(nameEl));
  }
  const toEl=host.querySelector("#lvTo");
  if(toEl){
    autosizeTo(toEl);
    toEl.addEventListener("input",()=>autosizeTo(toEl));
    // The private faces arrive after the first paint, and a wider face needs a
    // wider field than the fallback was measured at.
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>autosizeTo(toEl));
  }
  // Two frames: one to land the old angles, one to ease to the new.
  const pile=host.querySelectorAll(".lv-ghost[data-t]");
  if(pile.length) requestAnimationFrame(()=>requestAnimationFrame(()=>
    pile.forEach(g=>{ g.classList.add("lv-settling"); g.style.transform=g.dataset.t; })));
  placeLetterTopbar();
  renderPinnedMessage();
  letterNoEnter=false;
  const fileOpen=host.querySelector("#lvFileOpen");
  if(fileOpen) fileOpen.onclick=()=>{ letterFilingOpen=true; renderCurrentLetter(); };
  const fileForm=host.querySelector("#lvFile");
  if(fileForm){
    let gs=d.gift_self||"";
    fileForm.querySelectorAll("[data-gs]").forEach(b=>b.onclick=()=>{
      gs = (gs===b.dataset.gs) ? "" : b.dataset.gs;
      fileForm.querySelectorAll("[data-gs]").forEach(o=>o.classList.toggle("on", o.dataset.gs===gs));
    });
    host.querySelector("#lvFileCancel").onclick=()=>{ letterFilingOpen=false; renderCurrentLetter(); };
    fileForm.onsubmit=async ev=>{
      ev.preventDefault();
      // Their own words, on their own record. This is the column the whole
      // follow-up programme exists to fill.
      await persist({...d,
        story: host.querySelector("#lvFileStory").value.trim(),
        lives: host.querySelector("#lvFileLives").value.trim(),
        why:   host.querySelector("#lvFileWhy").value.trim(),
        gift_self: gs }, false);
      letterFilingOpen=false;
      renderLetters();
    };
  }
  // Written from the conversation rather than from a template. The thread the
  // Post panel already loaded is the whole input, so nothing is fetched twice.
  const readBtn=host.querySelector("#lvRead");

    if(readBtn.dataset.busy) return;
    const t=readerThread;
    if(!t || !t.msgs || !t.msgs.length){
      alert("No conversation loaded yet. Open their thread in the Post panel first.");
      return;

    const was=readBtn.textContent;

    try{
      const r=await letterFromThread(t, x);

      if(nextBody.endsWith(letterSignoff)) nextBody=nextBody.slice(0,-letterSignoff.length).replace(/\s+$/,"");

      retypeInto(bodyEl, nextBody, autosizeBody, ()=>{ delete readBtn.dataset.busy; });
    }catch(e){
      readBtn.textContent=was; delete readBtn.dataset.busy;

  };
  const prev=host.querySelector("#lvChevprev"), next=host.querySelector("#lvChevnext");

  if(next) next.onclick=()=>letterNavigate(1);
  wireLetterNav(host);
  const exitCompose=()=>{ letterComposing=false; letterComposeItem=null; renderLetters(); };
  if(composing){
    host.querySelector("#lvSkip").onclick=exitCompose;
    host.querySelector("#lvClose").onclick=()=>{
      playCloseAnimation(()=>{ inqSet(q.id,{status:"closed"}); exitCompose(); });
    };
  } else {
    host.querySelector("#lvTone").onclick=ev=>{
      const btn=ev.currentTarget;
      if(btn.dataset.busy) return;

      let nextBody=r.body;
      if(nextBody.endsWith(letterSignoff)) nextBody=nextBody.slice(0,-letterSignoff.length).replace(/\s+$/,"");
      btn.dataset.busy="1";
      btn.textContent="Tone \u00b7 "+r.toneName;

      retypeInto(bodyEl, nextBody, autosizeBody, ()=>{ delete btn.dataset.busy; });
    };
    host.querySelector("#lvSkip").onclick=()=>{ letterIdx=(letterIdx+1)%letterQueue.length; letterToneIdx=0; letterNoEnter=true; letterTypeIn=true; renderCurrentLetter(); };
    host.querySelector("#lvClose").onclick=()=>{
      playCloseAnimation(()=>{
        if(q) inqSet(q.id,{status:"closed"}); else markContacted(i);
        letterQueue.splice(letterIdx,1);
        if(letterIdx>=letterQueue.length) letterIdx=0;
        letterToneIdx=0;
        letterQueue.length ? renderCurrentLetter() : renderLetters();
      });
    };
  }
  host.querySelector("#lvSend").onclick=async ()=>{
    const subj=host.querySelector("#lvSubj").value;
    // the name lives on the button, not in the textarea — put it back for the send
    const body=host.querySelector("#lvBody").value.replace(/\s+$/,"")+"\n\n"+letterSignoff;
    const toEl=host.querySelector("#lvTo");
    const to=(toEl?toEl.value:email).trim();
    if(!to){ toEl && toEl.focus(); alert("This letter has no recipient yet. Add an address after To."); return; }
    if(!subj.trim()){ host.querySelector("#lvSubj").focus(); alert("Give the letter a subject before sending."); return; }
    // Nothing moves until the letter has actually gone. Advancing the queue on
    // a send that failed is what threw a written letter away.
    const ok = await sendLetter({subj, body, to});
    if(!ok) return;
    // It has actually gone, so it can be counted and flown into the Sent tab.
    noteSent(); letterJustSent=true;
    await new Promise(res=>playSendAnimation(res));
    renderReaderTop();
    if(composing){ exitCompose(); return; }

    letterQueue.splice(letterIdx,1);
    if(letterIdx>=letterQueue.length) letterIdx=0;

  const autosizeSubj=()=>{ subjEl.style.height="auto"; subjEl.style.height=subjEl.scrollHeight+"px"; };
  requestAnimationFrame(autosizeSubj); subjEl.addEventListener("input",autosizeSubj);
  const bodyEl=host.querySelector("#lvBody");
  const autosizeBody=()=>{ bodyEl.style.height="auto"; bodyEl.style.height=bodyEl.scrollHeight+"px"; };
  requestAnimationFrame(autosizeBody); bodyEl.addEventListener("input",autosizeBody);
  // Arriving at a letter writes it out; editing it does not.
  if(letterTypeIn){
    letterTypeIn=false;
    // The card fills in first, then the letter it belongs to. Each element is
    // emptied up front so nothing sits fully written while it waits its turn.
    const cardEl=host.querySelector(".lv-cardstack .lv-label");
    const cardNote=host.querySelector(".lv-quote, .lv-quote-edit");
    const cardName=host.querySelector(".lv-n2");
    const noteIsField = cardNote && cardNote.tagName==="TEXTAREA";
    const noteText = cardNote ? (noteIsField ? cardNote.value : cardNote.textContent) : "";
    const bodyText = bodyEl.value;
    const sizeNote = ()=>{ if(noteIsField){ cardNote.style.height="auto"; cardNote.style.height=cardNote.scrollHeight+"px"; } };
    // Measured with this letter's text still in place: that is the height the
    // card is growing towards, and it stays locked there while the words are
    // typed in so the box does not shuffle under them.
    const cardTo = cardEl ? cardEl.offsetHeight : 0;
    const cardFrom = letterCardH;
    letterCardH = cardTo;
    const releaseCard = ()=>{
      if(!cardEl) return;
      cardEl.style.transition=""; cardEl.style.height=""; cardEl.style.overflow="";
    };
    if(cardNote){ if(noteIsField) cardNote.value=""; else cardNote.textContent=""; sizeNote(); }
    bodyEl.value=""; autosizeBody();
    const writeNote=()=>{
      if(!cardNote){ releaseCard(); return writeLetter(); }
      if(noteIsField) cardNote.value=noteText; else cardNote.textContent=noteText;
      typeOut(cardNote, sizeNote, 760, ()=>{ releaseCard(); writeLetter(); });
    };
    const writeLetter=()=>{ bodyEl.value=bodyText; typeOut(bodyEl, autosizeBody); };
    const start = ()=>typeOut(cardName, null, 420, writeNote);
    // The card changes shape from letter to letter. It eases between the two
    // heights first, empty, and only then does anything start writing.
    const slow = matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(cardEl && cardFrom && Math.abs(cardTo-cardFrom)>2 && !slow){
      cardEl.style.overflow="hidden";
      cardEl.style.height=cardFrom+"px";
      void cardEl.offsetHeight;
      cardEl.style.transition="height .42s cubic-bezier(.22,.7,.2,1)";
      cardEl.style.height=cardTo+"px";
      setTimeout(start, 450);
    } else {
      if(cardEl){ cardEl.style.overflow="hidden"; cardEl.style.height=cardTo+"px"; }
      start();
    }
  }
  const noteEl=host.querySelector("#lvNote");
  if(noteEl){
    const autosizeNote=()=>{ noteEl.style.height="auto"; noteEl.style.height=noteEl.scrollHeight+"px"; };
    requestAnimationFrame(autosizeNote); noteEl.addEventListener("input",autosizeNote);
    noteEl.onblur=()=>{ if(q && noteEl.value!==(q.note||"")) inqSet(q.id,{ note:noteEl.value }); };
  }
}

function setView(v){
  // fade out, swap which surface is display:none underneath the fade, fade
  // back in — display can't be transitioned directly, so the swap happens
  // while briefly invisible rather than as a hard cut
  document.body.classList.add("lv-fading");
  setTimeout(()=>{
    document.body.classList.toggle("view-classic", v==="classic");
    document.body.classList.toggle("view-letters", v!=="classic");
    try{ localStorage.setItem("macon_surface", v); }catch(e){}
    document.querySelectorAll("#viewToggle button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
    if(v!=="classic") renderLetters();
    requestAnimationFrame(()=>document.body.classList.remove("lv-fading"));
  }, 180);
}
// Mark closed gets a send-off: a checkmark over the sheet, then it slides
// away, and only once that's played does the actual state change happen.
let letterJustSent=false;
/* Sent: the sheet whites out behind a paper plane, then flies into the Sent
   tab it is now filed under. The whoosh is synthesised rather than loaded, so
   there is no audio file to ship and nothing to fail to download. */
function whoosh(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const ctx=new AC(); const dur=0.55;
    const buf=ctx.createBuffer(1, Math.floor(ctx.sampleRate*dur), ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const bp=ctx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.1;
    bp.frequency.setValueAtTime(380, ctx.currentTime);
    bp.frequency.exponentialRampToValueAtTime(2600, ctx.currentTime+0.22);
    bp.frequency.exponentialRampToValueAtTime(520, ctx.currentTime+dur);
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16, ctx.currentTime+0.09);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+dur);
    src.connect(bp).connect(g).connect(ctx.destination);
    src.start(); src.stop(ctx.currentTime+dur);
    src.onended=()=>ctx.close();
  }catch{}
}
function playSendAnimation(onDone){
  const paper=document.querySelector(".lv-paper");
  if(!paper){ onDone(); return; }
  const btn=document.getElementById("lvSend");
  if(btn) btn.disabled=true;
  const mark=document.createElement("div");
  mark.className="lv-checkmark lv-sending";
  mark.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>`;
  paper.appendChild(mark);
  setTimeout(()=>{
    const tab=document.querySelector('.rd-tabs [data-folder="sent"]');
    const p=paper.getBoundingClientRect();
    if(tab && p.width && paper.animate){
      const t=tab.getBoundingClientRect();
      const sc=Math.max(t.width/p.width, .05);
      const dx=t.left-p.left+(t.width-p.width*sc)/2;
      const dy=t.top -p.top +(t.height-p.height*sc)/2;
      paper.classList.add("lv-flying");
      paper.style.transformOrigin="top left";
      // Thrown rather than slid: it rises through the middle of the trip and
      // falls into the tab, shrinking the whole way.
      paper.animate([
        { transform:"none", opacity:1 },
        { transform:`translate(${dx*.42}px, ${dy*.42-120}px) scale(${(1+sc)/2}) rotate(-7deg)`,
          opacity:.92, offset:.5 },
        { transform:`translate(${dx}px, ${dy}px) scale(${sc}) rotate(-16deg)`, opacity:0 }
      ], { duration:850, easing:"cubic-bezier(.35,0,.6,1)", fill:"forwards" });
    } else {
      paper.classList.add("lv-closing");
    }
    whoosh();
    setTimeout(onDone, 880);
  }, 700);
}
function playCloseAnimation(onDone){
  const btn=document.getElementById("lvClose");
  if(btn){ btn.classList.add("done"); btn.disabled=true; }
  const paper=document.querySelector(".lv-paper");
  if(!paper){ onDone(); return; }
  const mark=document.createElement("div");
  mark.className="lv-checkmark";
  mark.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
  paper.appendChild(mark);
  setTimeout(()=>{
    paper.classList.add("lv-closing");
    setTimeout(onDone, 450);
  }, 1000);
}

  });
})();

function completeFollowUp(i, qid){
  // Advances the record. Nothing is ever removed: an enquiry becomes "followed
  // up" and returns on its own if it goes quiet, and a collector simply stops
  // being due once last_contact is stamped.
  if(qid){ inqFollowUp(qid); return; }
  markContacted(i);
}
function markContacted(i){
  const d=data[i]; if(!d) return;
  const today=new Date().toISOString().slice(0,10);
  // `story` holds what the collector actually said, nothing else. Whether we
  // asked is already recorded by last_contact, and writing "Asked" in here is
  // what left the story column full of workflow flags and empty of stories.
  persist({...d, last_contact:today}, false);
}

/* ================= Invoice maker =================
   Three independent sequences (R/W/C) allocated server-side by new_invoice().
   Retail invoices are written by the Wix webhook and are read-only here; the
   keepers only ever hand-fill wholesale and custom.
   PDF is generated with pdf-lib, which embeds OTF/CFF outlines directly, so the
   text in the file is real selectable text in the studio's own faces. */

const INV_TAX_DEFAULT = 9.5;            // LA County. Editable per invoice.
const INV_PAPER = "#FEFCF6", INV_INK = "#1C1A18",
      INV_ORANGE = "#E2661C", INV_LABEL = "#9C8F76", INV_RULE = "#E3DED0";

function invBlank(kind){
  return { kind, issued_on:new Date().toLocaleDateString("en-CA"), bill_to:"", bill_email:"",
           bill_addr:"", items:[{desc:"",qty:1,unit:0}],
           discount_pct:0, tax_pct: kind==="wholesale"?0:INV_TAX_DEFAULT, notes:"Net 30. Thank you.", note_pos:"left" };
}
function invMath(v){
  const sub = (v.items||[]).reduce((a,l)=>a + (Number(l.qty)||0) * (Number(l.unit)||0), 0);
  const disc = sub * (Number(v.discount_pct)||0) / 100;
  const taxed = sub - disc;
  const tax = taxed * (Number(v.tax_pct)||0) / 100;
  return { sub, disc, taxed, tax, total: taxed + tax };
}
function invMoney(n){
  const r = Math.round(n*100)/100;
  return "$" + (Number.isInteger(r) ? r.toLocaleString("en-US")
    : r.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));
}
function invDate(s){
  const t = Date.parse((s||"")+"T00:00:00"); if(isNaN(t)) return "";
  const d = new Date(t), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}.${p(d.getDate())}.${String(d.getFullYear()).slice(2)}`;
}

/* ---------- live sheet ----------
   PDF.js renders the real file to canvas, and transparent inputs sit exactly
   over each editable value, positioned from the rectangles invoicePDF reports.
   Rendering it ourselves rather than handing it to the browser's PDF viewer is
   what makes the mapping exact and the same in every browser. */

let _pdfjsReady=null;
function loadPdfJs(){
  if(_pdfjsReady) return _pdfjsReady;
  const add=src=>new Promise((res,rej)=>{ const t=document.createElement("script");
    t.src=src; t.onload=res; t.onerror=()=>rej(new Error("could not load "+src)); document.head.appendChild(t); });
  _pdfjsReady=(async()=>{
    if(!window.pdfjsLib) await add("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    return window.pdfjsLib;
  })();
  return _pdfjsReady;
}

// Draw every sheet to canvas, then lay the editable fields over them.
async function invPaintSheets(bytes, width, height, pages){
  const pdfjsLib=await loadPdfJs();
  const host=document.getElementById("ivsSheets"); if(!host) return;
  const box=host.getBoundingClientRect();
  if(box.width<40 || box.height<40) return;   // pane collapsed; nothing to draw into
  // fit a sheet to the pane, leaving room for the gaps between multiples
  const avail=Math.max(1, box.height-(pages-1)*16-4);
  const scale=Math.min(box.width/width, pages>1 ? avail/height : box.height/height);
  const cssW=Math.floor(width*scale), cssH=Math.floor(height*scale);
  const dpr=Math.min(window.devicePixelRatio||1, 2);

  const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  host.innerHTML="";
  const painting=[];
  for(let pi=0; pi<doc.numPages; pi++){
    const page=await doc.getPage(pi+1);
    const vp=page.getViewport({scale:(cssW/width)*dpr});
    const wrap=document.createElement("div");
    wrap.className="ivs-sheet"; wrap.style.width=cssW+"px"; wrap.style.height=cssH+"px";
    const cv=document.createElement("canvas");
    cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    wrap.appendChild(cv); host.appendChild(wrap);
    painting.push(page.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise.catch(()=>{}));
      }
  Promise.all(painting).then(()=>doc.destroy()).catch(()=>{});
}


/* live preview: the real file, rebuilt on a debounce */
function invQueuePreview(now){
  clearTimeout(invS.timer);
  const p=document.getElementById("ivsPending"); if(p) p.classList.add("on");
  invS.timer=setTimeout(invRunPreview, now ? 0 : 150);
}

/* The sheet is drawn on the server, which takes about a second, so requests are
   coalesced rather than queued: while one is in flight the newest state is held
   and fired the moment it lands. Typing therefore updates as fast as the render
   can go and always finishes on the current state, instead of playing back a
   backlog. Identical payloads are served from a small cache, so undoing an edit
   or flipping a toggle is instant. */
let _invBusy=false, _invPending=false;
const _invCache=new Map();

async function invRunPreview(){
  if(_invBusy){ _invPending=true; return; }
  _invBusy=true;
  const p=document.getElementById("ivsPending");
  try{
    const key=JSON.stringify(invS.v);
    let r=_invCache.get(key);
    if(!r){
      r=await invoicePDF(invS.v);
      _invCache.set(key, r);
      if(_invCache.size>24) _invCache.delete(_invCache.keys().next().value);
    }
    // a newer edit landed while this was rendering; that one wins
    if(!_invPending) await invPaintSheets(r.bytes, r.width, r.height, r.pages);
  }catch(e){
    console.error("[invoice preview]", e);
    // surfaced rather than swallowed: the fonts now need a signed-in session,
    // so a failure here should say so instead of leaving a blank sheet
    if(p){ p.textContent = /sign|denied|403|400/i.test(String(e))
      ? "Sign in to load the typefaces" : "Could not draw the sheet";
      p.classList.add("on"); }
    _invBusy=false; return;
  }
  _invBusy=false;
  if(_invPending){ _invPending=false; invRunPreview(); }
  else if(p){ p.textContent="Setting type…"; p.classList.remove("on"); }
}

      .some(f=>String(f||"").toLowerCase().includes(q));

  const amt=x=>invMath(x).total, day=x=>Date.parse(x.issued_on)||0;

      issued_on:v.issued_on, bill_to:v.bill_to, bill_email:v.bill_email,
      bill_addr:v.bill_addr,
      items:(v.items||[]).map(l=>({desc:l.desc,qty:Number(l.qty)||0,unit:Number(l.unit)||0})),
      discount_pct:Number(v.discount_pct)||0, tax_pct:Number(v.tax_pct)||0,
      notes:v.notes, note_pos:v.note_pos||"left" }});

}
