<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maçon · Bureau of Provenance</title>
<link rel="icon" type="image/png" href="logos/crest.png">
<link rel="apple-touch-icon" href="logos/crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Louize";src:url("fonts/louize.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Louize";src:url("fonts/louize-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
  @font-face{font-family:"DM Mono";src:url("fonts/dm-mono-300.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
  :root{
    --ink:#2b2622;
    --paper:#f4efe4;
    --paper-2:#efe8d9;
    /* shared by the alternating ledger rows, the drawer bg, AND the ledger/provenance toggle — keep them matched by editing only this */
    --row-alt:#f6f4f2;
    --bronze:#8c6a47;
    --bronze-deep:#6f5235;
    --slate:#5b5a55;
    --rule:#dad5c9;
    --seal:#9c4a3a;
    --accent:#db6b50;
    --accent-deep:#bd5440;
    /* chat-button gradient, shared by stars + notification fills (SVG stars use #starGrad, defined in <body>) */
    --accent-grad:linear-gradient(165deg,var(--accent),var(--accent-deep));
    --high:#e9d9c2;
    --shadow:rgba(43,38,34,.10);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --serif-display:"Cormorant Garamond",Georgia,serif;
    --serif-soul:"EB Garamond",Georgia,serif;
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    /* subtle paper texture + column gradient: flat light-white right of the seam, warm paper left of it */
    background-image:radial-gradient(circle at 20% 10%, rgba(0,0,0,.012) 0, transparent 60%),
                     radial-gradient(circle at 80% 80%, rgba(0,0,0,.012) 0, transparent 60%),
                     linear-gradient(to right, var(--paper) 0%, var(--paper) calc(19vw - 116px), #fefdfb calc(26vw - 72px), #fefdfb 100%);
    -webkit-font-smoothing:antialiased;
  }
  body.has-ticker .wrap{padding-top:34px}
  body.has-ticker .col-right,body.has-ticker .col-left{height:calc(100vh - 34px)}
  body.has-ticker .drawer,body.has-ticker .drawer-rail{top:30px;height:calc(100vh - 30px)}
  body.has-ticker .sync{top:44px}
  .ticker{position:fixed;top:0;left:0;right:0;height:30px;z-index:60;display:none;align-items:center;overflow:hidden;
    background:var(--ink,#2b2622);color:#e8e2d6;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    box-shadow:0 2px 10px rgba(40,37,35,.25)}
  .ticker.show{display:flex}
  .ticker .tk-track{display:flex;flex:0 0 auto;white-space:nowrap;animation:tk-scroll var(--tk-dur,40s) linear infinite}
  .ticker:hover .tk-track{animation-play-state:paused}
  .ticker .tk-item{display:inline-flex;align-items:center;padding:0 28px}
  .ticker .tk-time{color:#d8a868;margin-right:10px}
  .ticker .tk-dot{margin:0 0 0 28px;color:var(--bronze,#a8845c)}
  @keyframes tk-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .daybrief{position:fixed;top:66px;left:calc(4.5vw - 24px);right:auto;z-index:55;width:calc(21vw - 28px);background:rgba(252,250,245,.38);border:1px solid var(--rule);
    border-radius:12px;box-shadow:0 18px 44px rgba(40,37,35,.22);padding:22px 24px 28px 30px;
    -webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);
    animation:db-in .35s cubic-bezier(.2,.8,.2,1);box-sizing:border-box;
    transition:width .38s cubic-bezier(.2,.8,.2,1),height .38s cubic-bezier(.2,.8,.2,1),padding .38s cubic-bezier(.2,.8,.2,1)}
  .daybrief.min{display:none}
  .daybrief.min>*:not(.db-icon){display:none}
  .daybrief .db-icon{display:none;border:none;background:transparent;padding:0;margin:0;color:#000;cursor:pointer;line-height:0}
  .daybrief.min .db-icon{display:block}
  @keyframes db-in{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:translateY(0)}}
  .daybrief .db-kicker{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#4f7d57;background:rgba(79,125,87,.13);border:none;border-radius:999px;padding:3px 11px;margin-bottom:9px}
  .daybrief h3{font-family:"Louize",Georgia,serif;font-weight:400;font-size:29px;margin:0;color:var(--ink)}
  .daybrief h3 i{font-style:italic;font-size:25px}
  .daybrief .db-rule{border:none;border-top:1px solid #e4ded1;margin:8px 0 24px}
  .daybrief ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;width:100%}
  .daybrief li{position:relative;display:flex;gap:13px;align-items:baseline;width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);line-height:1.35;cursor:pointer;padding-right:24px;transition:color .15s}
  .daybrief li .db-check{position:absolute;right:0;top:50%;transform:translateY(-50%);opacity:0;color:#a09b91;transition:opacity .15s;pointer-events:none}
  .daybrief li .db-go{position:absolute;right:24px;top:50%;transform:translateY(-50%);opacity:0;color:#a09b91;transition:opacity .15s,color .12s;cursor:pointer;border:none;background:transparent;padding:2px;line-height:0;display:flex}
  .daybrief li:hover .db-go{opacity:1}
  .daybrief li .db-go:hover{color:var(--ink)}
  .daybrief li.has-go{padding-right:46px}
  .daybrief li:hover .db-check{opacity:1}
  .daybrief li.done{color:#a09b91}
  .daybrief li.done .db-text{text-decoration:line-through;text-decoration-thickness:.75px}
  .daybrief li.done .db-time{color:#bcb5a6}
  .daybrief li.done .db-check{opacity:1;color:#4f7d57}
  .daybrief li .db-time{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--bronze);letter-spacing:.06em}
  .daybrief li .db-text{flex:1;min-width:0}
  .daybrief .db-kicker-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .daybrief .db-kicker-row .db-kicker{margin-bottom:0}
  .daybrief .db-nav{flex:0 0 auto;border:none;background:transparent;color:#b3ab9c;font-size:15px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:6px;font-family:var(--sans);transition:color .15s,background .15s}
  .daybrief .db-nav:hover{color:var(--ink);background:rgba(0,0,0,.05)}
  .daybrief .db-main{width:100%}
  .daybrief .db-clear{font-family:var(--serif-soul);font-style:italic;font-size:13px;color:#b3ab9c}
  .daybrief .db-ahead{width:100%;margin-top:20px;padding-top:16px;border-top:1px solid #e4ded1}
  .daybrief .db-ahead-h{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#b3ab9c;margin-bottom:11px}
  .daybrief .db-ahead-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;width:100%}
  .daybrief .db-ahead-list li{position:relative;display:flex;gap:13px;align-items:baseline;width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);line-height:1.35;cursor:default;padding-right:0}

  /* ===== Studio Line — keeper chat ===== */
  .chat-fab{position:fixed;left:24px;bottom:24px;width:45px;height:45px;border-radius:50%;border:none;cursor:pointer;z-index:60;
    background:var(--accent-grad);
    box-shadow:0 8px 22px color-mix(in srgb,var(--accent-deep) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .18s ease,box-shadow .18s ease}
  .chat-fab:hover{transform:translateY(-2px);box-shadow:0 14px 32px color-mix(in srgb,var(--accent-deep) 54%,transparent)}
  .chat-fab svg{width:19px;height:19px;display:block}
  .chat-fab .chat-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;
    background:#e5443b;color:#fff;font-family:var(--sans);font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--paper),0 2px 7px rgba(229,68,59,.6),0 0 11px rgba(229,68,59,.55);
    opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
  body.chat-unread .chat-fab .chat-badge{opacity:1;transform:scale(1);animation:chatPulse 1.8s ease-out infinite}
  @keyframes chatPulse{
    0%{box-shadow:0 0 0 2px var(--paper),0 0 0 0 rgba(229,68,59,.55),0 2px 7px rgba(229,68,59,.6)}
    70%{box-shadow:0 0 0 2px var(--paper),0 0 0 7px rgba(229,68,59,0),0 2px 7px rgba(229,68,59,.6)}
    100%{box-shadow:0 0 0 2px var(--paper),0 0 0 0 rgba(229,68,59,0),0 2px 7px rgba(229,68,59,.6)}}
  body.chat-open .chat-fab{transform:scale(.92);opacity:.85}

  .chat-panel{position:fixed;left:24px;bottom:24px;width:360px;height:min(540px,calc(100vh - 48px));z-index:61;
    background:var(--paper);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 24px 64px rgba(40,28,16,.34);
    transform:translateY(16px) scale(.96);opacity:0;pointer-events:none;transform-origin:left bottom;
    transition:transform .26s cubic-bezier(.2,.8,.25,1),opacity .2s ease}
  body.chat-open .chat-panel{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}

  .chat-head{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:15px 16px 13px;
    background:linear-gradient(180deg,var(--paper-2),var(--paper));border-bottom:1px solid rgba(43,38,34,.09)}
  .chat-head .ch-av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;background:#cdbfa8 var(--av-other) center/cover no-repeat}
  .chat-head .ch-meta{flex:1 1 auto;min-width:0}
  .chat-head .ch-name{font-family:"Louize",Georgia,serif;font-weight:400;font-size:21px;color:var(--ink);line-height:1.1}
  .chat-head .ch-status{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:.01em;color:#9a8f7f;margin-top:1px}
  .chat-head .ch-dot{width:7px;height:7px;border-radius:50%;background:#c3b9a8;transition:background .25s,box-shadow .25s}
  .chat-head.online .ch-dot{background:#5b9e6a;box-shadow:0 0 0 3px rgba(91,158,106,.2)}
  .chat-head .ch-close{flex:0 0 auto;border:none;background:transparent;color:#b3ab9c;font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:8px;transition:color .15s,background .15s}
  .chat-head .ch-close:hover{color:var(--ink);background:rgba(0,0,0,.05)}

  .chat-thread{flex:1 1 auto;overflow-y:auto;padding:16px 16px 6px;display:flex;flex-direction:column;gap:8px;
    background:radial-gradient(circle at 18% 12%,rgba(140,106,71,.05),transparent 60%),radial-gradient(circle at 84% 78%,rgba(156,74,58,.045),transparent 55%),var(--paper)}
  .chat-thread::-webkit-scrollbar{width:7px}
  .chat-thread::-webkit-scrollbar-thumb{background:rgba(43,38,34,.16);border-radius:99px}

  .chat-day{align-self:center;display:flex;align-items:center;gap:10px;margin:8px 0 4px;color:#a89e8d;font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .chat-day::before,.chat-day::after{content:"";display:block;width:34px;height:1px;background:rgba(43,38,34,.14)}

  .msg{max-width:86%;display:flex;align-items:flex-end;gap:7px;animation:msgIn .22s ease}
  .msg-av{width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:#cdbfa8 center/cover no-repeat;box-shadow:0 1px 3px rgba(40,28,16,.18)}
  .msg.them .msg-av{background-image:var(--av-other)}
  .msg.me .msg-av{background-image:var(--av-me)}
  .msg-col{display:flex;flex-direction:column;gap:3px;min-width:0}
  .msg.them{align-self:flex-start}
  .msg.them .msg-col{align-items:flex-start}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .msg-col{align-items:flex-end}
  .msg .bub{padding:8px 12px;border-radius:15px;font-family:var(--sans);font-size:13.5px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
  .msg .stamp{font-family:var(--sans);font-size:10px;letter-spacing:.01em;color:#b3a996;padding:0 4px}
  .msg.them .bub{background:#fff;color:var(--ink);border:1px solid rgba(43,38,34,.07);border-bottom-left-radius:5px;box-shadow:0 2px 7px rgba(40,28,16,.06)}
  .msg.me .bub{background:var(--accent-grad);color:#f6f1e6;border-bottom-right-radius:5px;box-shadow:0 3px 9px rgba(111,82,53,.28)}
  .msg.me .stamp{color:#bcae99}
  .msg .seen{font-family:var(--sans);font-size:10px;color:var(--accent);letter-spacing:.01em;padding:0 4px;display:none}
  .msg.me.is-seen .seen{display:block}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .chat-typing{display:none;align-items:center;gap:7px;padding:2px 16px 6px;font-family:var(--sans);font-size:11.5px;color:#9a8f7f}
  body.chat-typing-on .chat-typing{display:flex}
  .chat-typing .tdots{display:inline-flex;gap:3px}
  .chat-typing .tdots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.5;animation:tbounce 1.1s infinite}
  .chat-typing .tdots i:nth-child(2){animation-delay:.18s}
  .chat-typing .tdots i:nth-child(3){animation-delay:.36s}
  @keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:.9}}

  .chat-err{display:none;font-family:var(--sans);font-size:11.5px;color:var(--seal);background:rgba(156,74,58,.08);padding:7px 14px;border-top:1px solid rgba(156,74,58,.16)}
  .chat-err.show{display:block}
  .chat-compose{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:11px 12px 13px;border-top:1px solid rgba(43,38,34,.09);background:var(--paper-2)}
  .chat-inputwrap{position:relative;flex:1 1 auto;display:flex}
  .chat-compose textarea{flex:1 1 auto;box-sizing:border-box;resize:none;border:none;border-radius:13px;background:#faf7f0;color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.35;min-height:42px;height:42px;padding:11px 64px 6px 12px;max-height:100px;outline:none}
  .chat-compose textarea:focus{outline:none;box-shadow:none}
  .chat-compose textarea::placeholder{color:#b3a996;font-style:normal}
  .chat-send,.chat-emoji{position:absolute;bottom:13px;width:16px;height:16px;padding:0;border:none;background:transparent;cursor:pointer;color:#9b9488;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s,color .15s}
  .chat-send{right:12px}
  .chat-emoji{right:36px}
  .chat-send:hover,.chat-emoji:hover{transform:scale(1.1);color:var(--bronze-deep)}
  .chat-send:disabled{opacity:.35;cursor:default;transform:none}
  .chat-send svg,.chat-emoji svg{width:16px;height:16px;display:block}
  .chat-emoji-pop{position:absolute;bottom:56px;right:12px;width:236px;max-height:184px;overflow-y:auto;background:#fff;border:1px solid rgba(43,38,34,.1);border-radius:12px;box-shadow:0 12px 30px rgba(40,28,16,.22);padding:8px;display:none;grid-template-columns:repeat(7,1fr);gap:2px;z-index:62}
  .chat-emoji-pop.show{display:grid}
  .chat-emoji-pop button{border:none;background:transparent;cursor:pointer;font-size:18px;line-height:1;padding:5px 0;border-radius:7px;transition:background .12s}
  .chat-emoji-pop button:hover{background:rgba(140,106,71,.12)}
  /* incoming-message toast — shown top-right when a message arrives with the panel closed */
  .chat-toast{position:fixed;top:20px;right:20px;z-index:70;width:322px;max-width:calc(100vw - 40px);
    display:flex;gap:11px;align-items:flex-start;padding:13px 34px 14px 14px;
    background:rgba(252,250,245,.98);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1);
    border:1px solid rgba(43,38,34,.10);border-radius:14px;box-shadow:0 14px 34px rgba(40,28,16,.20);
    cursor:pointer;opacity:0;transform:translateX(24px);transition:opacity .25s ease,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  .chat-toast.show{opacity:1;transform:translateX(0);pointer-events:auto}
  .chat-toast .ct-av{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#cdbfa8 var(--av-other) center/cover no-repeat;box-shadow:0 1px 4px rgba(40,28,16,.18)}
  .chat-toast .ct-body{flex:1;min-width:0}
  .chat-toast .ct-name{font-family:"Louize",Georgia,serif;font-size:15px;color:var(--ink);line-height:1.1;margin-bottom:3px}
  .chat-toast .ct-msg{font-family:var(--sans);font-size:13px;line-height:1.4;color:#6f685c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .chat-toast .ct-x{position:absolute;top:8px;right:9px;width:22px;height:22px;border:none;background:transparent;color:#b3a996;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .15s,color .15s}
  .chat-toast .ct-x:hover{background:rgba(43,38,34,.06);color:var(--ink)}
  .daybrief .db-ahead-list .db-text{flex:1;min-width:0}
  .daybrief .db-x{position:absolute;top:10px;right:12px;width:28px;height:28px;border:none;background:transparent;color:var(--slate);
    font-size:20px;line-height:1;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .daybrief .db-x:hover{background:var(--paper-2);color:var(--ink)}
  .wrap{margin:0;padding:0 40px 150px;min-height:100vh;display:grid;grid-template-columns:30% 1fr;gap:44px;align-items:start}
  .col-left{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .mast{animation:rise .45s ease both .04s}
  body:not(.booted) .dash .stat:nth-child(1){animation:rise .45s ease both .12s}
  body:not(.booted) .dash .stat:nth-child(2){animation:rise .45s ease both .17s}
  body:not(.booted) .dash .stat:nth-child(3){animation:rise .45s ease both .22s}
  body:not(.booted) .dash .stat:nth-child(4){animation:rise .45s ease both .27s}
  .progress-card{animation:rise .45s ease both .34s}
  .tabsbar{animation:rise .45s ease both .4s}
  .toolbar{animation:rise .45s ease both .08s}
  .ledger-head{animation:rise .45s ease both .16s}
  .pager{animation:rise .45s ease both .55s}
  .col-right{min-width:0;padding-top:40px;height:100vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:40px}
  @media(max-width:820px){
    .wrap{grid-template-columns:1fr;gap:24px}
    .col-left{position:static;height:auto}
    .col-right{padding-top:0;height:auto;overflow:visible;padding-bottom:24px}
    .col-right .ledger{flex:none}
  }

  /* ---------- Sync badge ---------- */
  .sync{position:fixed;top:14px;right:18px;font-family:var(--sans);font-size:10px;
        letter-spacing:.14em;text-transform:uppercase;color:var(--slate);display:none;align-items:center;gap:7px;z-index:40;
        background:rgba(255,255,255,.4);padding:6px 11px;border:1px solid var(--rule)}
  .sync .led{width:7px;height:7px;border-radius:50%;background:var(--rule)}
  .sync.on .led{background:#6f8a5a} .sync.local .led{background:var(--bronze)}

  /* ---------- Masthead ---------- */
  header.mast{text-align:center;padding:0 0 6px;margin:0}
  .crest-wrap{position:relative;display:inline-block}
  .crest-img{display:block;width:296px;max-width:100%;height:auto}
  .stamp{position:fixed;top:max(-89.6px,calc(-9.08vw + 47.2px));left:max(-89.6px,calc(-9.08vw + 47.2px));height:min(337.5px,calc(34.2vw - 177.8px));width:auto;z-index:-1;pointer-events:none;transform:rotate(-20deg)}
  .crest{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:13px;letter-spacing:.5em;
          color:var(--bronze);text-transform:uppercase;margin:0 0 14px;padding-left:.5em}
  .wordmark{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:54px;letter-spacing:.18em;
            margin:0;line-height:1;padding-left:.18em}

  /* ---------- Ledger ---------- */

         grid-template-columns:52px 1fr 186px 162px 108px 162px 44px;align-items:center;align-content:center;cursor:pointer;max-height:88px;transition:padding .22s ease,background .12s ease}
  .entry:nth-child(even){background:linear-gradient(to right,transparent 0,var(--row-alt) 15%,var(--row-alt) 85%,transparent 100%);border-radius:8px}
  /* progressively drop least-important columns as the table narrows (avoids overlap).
     Drawer OPEN shrinks the table ~422px-equivalent, so its breakpoints fire ~422px sooner. */

  }

  .ledger.compact .entry{padding:9px 18px 9px 26px;max-height:52px}

  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:22px 24px 16px;position:relative;z-index:2;background:transparent;box-shadow:0 10px 16px -10px rgba(40,37,35,.28)}
  .drawer-title{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6f6655}
  .drawer-title .dt-ico{font-size:13px;color:#6f6655}
  .dt-badge{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:0;color:#fff;background:var(--accent-grad);border-radius:999px;
        min-width:24px;height:22px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 9px rgba(217,106,44,.5)}
  .dt-badge.zero{display:none}
  .drawer-close{width:30px;height:30px;border:none;background:transparent;color:#9b9488;cursor:pointer;font-size:18px;transition:.15s}
  .drawer-close:hover{color:var(--ink)}
  .drawer-body{flex:1;overflow:auto;padding:24px 24px 124px;display:flex;flex-direction:column;gap:24px}
  .drawer-empty{color:#9b9488;font-family:var(--serif-soul);font-style:italic;font-size:15px;text-align:center;margin-top:30px}
  .fgroup{display:flex;flex-direction:column;gap:10px}
  .fgroup-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px;padding-top:6px}
  .fgroup-titles{min-width:0}
  .fgroup-over{font-family:var(--sans);font-variant-caps:all-small-caps;text-transform:none;font-size:13.5px;font-weight:600;letter-spacing:.16em;color:#bcb3a4;margin-bottom:13px}
  .fgroup-pri{font-family:"Louize",Georgia,serif;font-size:22pt;font-weight:400;letter-spacing:0;color:#000;line-height:1.0}
  .fgroup-mark{flex:0 0 auto;display:inline-flex;align-items:center;border:1px solid rgba(43,38,34,.12);background:none;padding:6px 10px;border-radius:6px;font-family:var(--sans);text-transform:none;font-size:12px;font-weight:400;letter-spacing:normal;color:#9c9286;cursor:pointer;transition:color .15s,border-color .15s;white-space:nowrap;line-height:1}
  .fgroup-mark:hover{color:#000;border-color:#000}
  .fcard{display:flex;flex-direction:row;gap:0;flex:0 0 auto;border:1px solid rgba(43,38,34,.06);border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(40,28,16,.10);position:relative;cursor:pointer;
    transition:box-shadow .18s ease,transform .2s ease}
  .fcard:hover{transform:translateY(-4px);background:#fff;box-shadow:0 12px 28px rgba(40,28,16,.16)}
  .fcard.leaving{transform:translateX(80px);opacity:0;
    transition:transform .38s cubic-bezier(.4,0,.7,1),opacity .38s ease,height .38s ease,margin .38s ease}
  .fcard-img{position:relative;flex:0 0 auto;width:100%;height:91px;background:var(--paper-2)}
  .fcard-img img{width:100%;height:100%;object-fit:cover;display:block}
  .fcard-img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(to top,#fff,rgba(255,255,255,0));pointer-events:none;z-index:1}
  .fcard-body{position:relative;flex:1;min-width:0;padding:25px 18px 25px 10px}
  .fcard-top{display:flex;align-items:center;gap:13px}
  .fcard .fav-av{width:25.9%;flex:0 0 25.9%;align-self:stretch;margin:13px;position:relative;border-radius:9px;overflow:hidden;background:var(--paper-2)}
  .fcard .fav-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .fcard .ftitle{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .fcard .fn{align-self:flex-start;display:inline-flex;align-items:center;padding:3px 9px 4px;border-radius:999px;background:#ede8dc;
    font-family:var(--sans);font-variant-caps:all-small-caps;font-size:8.5pt;font-weight:500;letter-spacing:.08em;line-height:1.1;color:#8f897e;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .fn.t-vip{background:#f4ead6;color:#9a7838}
  .fn.t-reconnect{background:#dde9f5;color:#4a6d92}
  .fn.t-repeat{background:#e1efd6;color:#5d7e47}
  .fn.t-gift{background:#f7e3da;color:#a8624a}
  .fn.t-value{background:#f2e8c8;color:#8a7338}
  .fn.t-first{background:#ece8df;color:#7c7568}
  .fn.t-custom{background:#f0ddd2;color:#a2543a}
  .fcard .fsum{font-family:var(--sans);font-size:13px;line-height:1.45;color:#9c9488;margin-top:2px}
  .fcard .fmeta{font-family:var(--sans);font-size:11.5px;letter-spacing:.02em;color:#a8a094;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fcard .fmeta .fmeta-dim{color:#a8a094}
  .fcard .ftype{font-family:"Louize",Georgia,serif;font-size:20pt;line-height:1.15;color:#2b2622;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .daychip{position:absolute;top:14px;right:43px;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;padding:0;color:#fff;border:none;font-family:var(--sans);font-size:12px;font-weight:700;line-height:1;z-index:3;background:#3a6ea5}
  .fcard.important{background:#fff}
  .fcard.important:hover{background:#fff}
  .fcard .fn svg{flex:0 0 auto;margin-right:4px}
  .fimp{position:absolute;top:-4px;right:-4px;width:11px;height:11px;border-radius:50%;background:var(--accent-grad);z-index:6;box-shadow:0 0 0 2.5px #fff,0 1px 4px rgba(198,92,70,.45)}
  .donechip{position:absolute;top:14px;right:16px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%;
    border:none;background:rgba(43,38,34,.06);color:#9a9286;line-height:1;cursor:pointer;z-index:3;
    transition:background .18s ease,color .18s ease}
  .donechip svg{width:19px;height:19px}
  .donechip:hover{background:#4f7d57;color:#fff}
  .donechip.done{background:#4f7d57;color:#fff}
  .daychip.High{background:#c0392b}
  .daychip.Medium{background:#b5651d}
  .daychip.Low{background:#3a6ea5}
  /* collapsed rail */
  .drawer-rail{position:fixed;top:0;right:0;height:100vh;width:20px;border:none;
        background:var(--accent);cursor:pointer;z-index:44;display:none;transition:width .2s ease;padding:0;
        box-shadow:-10px 0 26px rgba(40,37,35,.26)}
  body.drawer-collapsed .drawer-rail{display:none}
  .rail-handle{position:fixed;right:8px;top:50%;transform:translateY(-50%);width:4px;height:24px;border-radius:2px;background:var(--rule);z-index:44;cursor:pointer;display:none;transition:background .15s}
  .rail-handle:hover{background:var(--slate)}
  body.drawer-collapsed .rail-handle{display:block}
  .rail-dot{width:6px;height:6px;border-radius:50%;background:#fff;flex:0 0 auto}
  .drawer-rail:hover{width:28px}
  .drawer-rail #railLabel{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--mono);font-weight:700;font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#fff}
  @media(max-width:820px){
    body{padding-right:0}
    .drawer{width:min(380px,86vw)}
  }

  /* ---------- Detail / provenance card ---------- */
  .scrim{position:fixed;inset:0;background:rgba(43,38,34,.45);display:none;align-items:center;
         justify-content:center;padding:40px 20px;overflow:auto;z-index:70}
  .scrim.show{display:flex}
  .card{background:var(--paper);max-width:680px;width:100%;border:1px solid var(--rule);border-radius:12px;
        box-shadow:0 24px 60px var(--shadow);position:relative;overflow:hidden}
  .card .seal{position:absolute;right:24px;top:22px;width:74px;height:74px;border:2px solid var(--seal);border-radius:50%;
        color:var(--seal);display:flex;align-items:center;justify-content:center;text-align:center;
        font-family:"Cormorant Garamond",serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;
        line-height:1.25;opacity:.7;transform:rotate(-8deg)}
  .card-body{padding:40px 44px 32px}
  .card input,.card textarea,.card select,.card .btn{border-radius:4px}
  .card h2{font-family:"Louize",Georgia,serif;font-weight:400;font-size:29px;letter-spacing:.02em;margin:0 0 28px}
  .card h2:has(+ .acc-line),.card h2:has(+ .dchips){margin-bottom:7px}
  .card .acc-line{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--bronze);margin-bottom:28px}
  .fields{display:grid;grid-template-columns:1fr 1fr;gap:2px 28px;margin-bottom:8px}
  .field{padding:11px 0;border-bottom:1px solid var(--rule)}
  .field.full{grid-column:1/-1}
  .field label{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);margin-bottom:5px}
  .field .val{font-size:17px;min-height:22px}
  .field .val:empty::before{content:"—";color:var(--rule)}
  .field .val.script{font-family:var(--serif-soul);font-style:italic;font-size:19px;line-height:1.35}
  .card-actions{display:flex;justify-content:space-between;gap:10px;padding:20px 44px 34px}
  .modal-x{position:absolute;top:16px;right:18px;width:32px;height:32px;border:none;background:transparent;color:var(--slate);font-size:24px;line-height:1;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:6;transition:background .12s,color .12s}
  .modal-x:hover{background:var(--paper-2);color:var(--ink)}
  /* Draft modal extras */
  .dpri{position:absolute;top:30px;right:34px;width:34px;height:34px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fffbf0;font-size:20px;font-weight:700;line-height:1;z-index:1}
  .dpri.High{background:#d96a2c} .dpri.Medium{background:#c79a3f} .dpri.Low{background:#b3ad9f}
  .dchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
  .dwho{margin:-12px 0 24px;padding:12px 14px;background:rgba(140,106,71,.07);border-radius:8px}
  .dwho-ig{display:inline-flex;align-items:center;gap:6px;color:var(--bronze);text-decoration:none;font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.02em}
  .dwho-ig:hover{color:var(--ink)}
  .dwho-note{font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--slate);margin:8px 0 0;white-space:pre-wrap}
  .ig-wrap{display:flex;align-items:center;position:relative}
  .ig-wrap .ig-at{position:absolute;left:13px;color:#a8a294;font-size:14px;pointer-events:none}
  .ig-wrap input{padding-left:25px;padding-right:34px;width:100%}
  .ig-wrap .ig-open{position:absolute;right:12px;color:#3a7bd5;display:flex;line-height:0;text-decoration:none}
  .ig-wrap .ig-open:hover{color:#2c63ad}
  /* ---------- Invoice studio ---------- */
  .ivs{position:fixed;inset:0;z-index:400;display:none;align-items:center;justify-content:center;background:rgba(30,26,22,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .ivs.on{display:flex}
  .ivs-win{width:95vw;height:95vh;background:var(--row-alt,#f6f2e8);border-radius:18px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(30,22,14,.35)}
  .ivs-head{display:flex;align-items:center;gap:16px;padding:14px 18px;border-bottom:1px solid rgba(43,38,34,.10);background:transparent}
  .ivs-h1{font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6f6655}
  .ivs-num{font-family:var(--mono);font-size:12px;color:var(--notes,#C04722);letter-spacing:.06em}
  .ivs-head .sp{flex:1}
  .ivs-body{flex:1;display:grid;grid-template-columns:304px minmax(0,1fr) 268px;min-height:0}
  .ivs-form{overflow-x:hidden;overflow-y:auto;padding:18px;border-right:1px solid rgba(43,38,34,.10);display:grid;gap:13px;align-content:start}
  .ivs-preview{min-width:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(43,38,34,.05)}
  .ivs-sheets{width:100%;height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
  .ivs-sheet{position:relative;flex:0 0 auto;border-radius:6px;box-shadow:0 8px 30px rgba(30,22,14,.18);background:#fff}
  .ivs-sheet canvas{display:block;border-radius:6px;width:100%;height:auto}
  /* A field is invisible until you go near it: the canvas is the truth. On focus
     the input paints itself over the canvas text and shows what you are typing. */
  .ivf{position:absolute;border:none;padding:0;margin:0;background:transparent;color:transparent;
    caret-color:var(--notes,#C04722);border-radius:3px;outline:none;box-sizing:border-box;
    font-family:"Gabriele",var(--mono);line-height:1;transition:background .12s,box-shadow .12s}
  .ivf::selection{background:rgba(198,92,70,.22)}
  .ivs-sheet:hover .ivf{box-shadow:inset 0 0 0 1px rgba(43,38,34,.10)}
  .ivf:hover{background:rgba(43,38,34,.045)}
  .ivf:focus{background:var(--inv-paper,#FEFCF6);box-shadow:inset 0 0 0 1px rgba(198,92,70,.55)}
  .ivf:focus{color:var(--ivf-ink,#1C1A18)}
  .ivs-pending{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:#9b9488;opacity:0;transition:opacity .2s}
  .ivs-pending.on{opacity:1}
  .ivs-arc{overflow:auto;border-left:1px solid rgba(43,38,34,.10);padding:16px 14px;display:grid;gap:8px;align-content:start}
  .ivs-arc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
  .ivs-arc-head .t{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9b9488}
  .ivs-card{border:1px solid rgba(43,38,34,.09);background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer;transition:.15s}
  .ivs-card:hover{box-shadow:0 4px 14px rgba(40,28,16,.10);transform:translateY(-1px)}
  .ivs-card.on{border-color:var(--notes,#C04722)}
  .ivs-card .n{font-family:var(--mono);font-size:11px;color:var(--notes,#C04722)}
  .ivs-card .w{font-family:var(--sans);font-size:13px;color:var(--ink);margin:2px 0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ivs-card .f{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:#9b9488}
  .ivs-grid{position:absolute;inset:0;background:var(--row-alt,#f6f2e8);display:none;flex-direction:column;padding:18px 22px}
  .ivs-grid.on{display:flex}
  .ivs-gtop{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .ivs-gtop input{flex:1;max-width:340px;font-family:var(--sans);font-size:13.5px;padding:8px 12px;
    border:1px solid rgba(43,38,34,.16);border-radius:8px;background:#fff}
  .ivs-gtop select{font-family:var(--sans);font-size:12.5px;padding:8px 10px;border:1px solid rgba(43,38,34,.16);border-radius:8px;background:#fff}
  .ivs-gwrap{flex:1;overflow:auto}
  .ivs-gcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
  .ivs-empty{color:#9b9488;font-family:var(--serif-soul);font-style:italic;font-size:15px;padding:30px 0}
  /* the archive narrows before it ever disappears */
  @media(max-width:1240px){ .ivs-body{grid-template-columns:286px minmax(0,1fr) 218px} }
  @media(max-width:1020px){ .ivs-body{grid-template-columns:272px minmax(0,1fr)} .ivs-arc{display:none} }

  /* ---------- Invoice maker ---------- */
  @font-face{font-family:"TAY Flapjack";src:url("fonts/tay-flapjack.woff") format("woff");font-display:swap}
  @font-face{font-family:"TAY Birdie";src:url("fonts/tay-birdie.woff") format("woff");font-display:swap}
  @font-face{font-family:"Loma";src:url("fonts/loma.woff2") format("woff2");font-display:swap}
  @font-face{font-family:"Gabriele";src:url("fonts/gabriele-l.woff2") format("woff2");font-display:swap}
  .inv-form{display:grid;gap:14px}
  .inv-kinds{display:flex;gap:8px}
  .inv-kinds button{flex:1;height:36px;border:1px solid rgba(43,38,34,.18);background:transparent;border-radius:8px;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#7c7568;transition:.15s}
  .inv-kinds button.on{background:var(--notes,#C04722);border-color:transparent;color:#fff}
  .inv-grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .inv-form label,.ivs-form label{display:block;font-family:var(--sans);font-size:11.5px;color:#8b8375;margin-bottom:4px}
  .inv-form input,.inv-form textarea,.ivs-form input,.ivs-form textarea{width:100%;box-sizing:border-box;font-family:var(--sans);font-size:13.5px;padding:8px 10px;
    border:1px solid rgba(43,38,34,.16);border-radius:7px;background:#fff;color:var(--ink)}
  .inv-lines{display:grid;gap:7px}
  .inv-line{display:grid;grid-template-columns:78px minmax(0,1fr) 74px 22px;gap:7px;align-items:center}
  .inv-qty{display:flex;align-items:center;border:1px solid rgba(43,38,34,.16);border-radius:7px;background:#fff;overflow:hidden;height:35px}
  .inv-qty button{width:26px;height:100%;border:none;background:transparent;cursor:pointer;color:#8b8375;font-size:15px;line-height:1}
  .inv-qty button:hover{background:rgba(43,38,34,.06);color:var(--ink)}
  .inv-qty input{border:none;text-align:center;padding:0;font-family:var(--mono);font-size:13px;width:100%}
  .inv-del{border:none;background:transparent;color:#c9c2b4;cursor:pointer;font-size:17px;line-height:1}
  .inv-del:hover{color:var(--notes,#C04722)}
  .inv-addline{justify-self:start;border:1px dashed rgba(43,38,34,.22);background:transparent;border-radius:7px;padding:6px 12px;
    cursor:pointer;font-family:var(--sans);font-size:12px;color:#8b8375}
  .inv-addline:hover{color:var(--ink);border-color:rgba(43,38,34,.4)}
  .inv-totals{border-top:1px solid rgba(43,38,34,.12);padding-top:12px;display:grid;gap:6px}
  .inv-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:12.5px;color:#6f6655}
  .inv-row.grand{font-size:17px;color:var(--notes,#C04722);padding-top:6px}
  .inv-row .pct{width:56px;text-align:right;font-family:var(--mono);font-size:12.5px;padding:3px 6px;
    border:1px solid rgba(43,38,34,.16);border-radius:5px;background:#fff}
  .inv-num{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#9b9488}
  .inv-list{display:grid;gap:2px;max-height:320px;overflow:auto}
  .inv-item{display:grid;grid-template-columns:74px 1fr 92px 88px;gap:10px;align-items:center;padding:9px 10px;border-radius:7px;cursor:pointer}
  .inv-item:hover{background:rgba(43,38,34,.045)}
  .inv-item .n{font-family:var(--mono);font-size:11.5px;color:var(--notes,#C04722)}
  .inv-item .w{font-family:var(--sans);font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .inv-item .d,.inv-item .t{font-family:var(--mono);font-size:11.5px;color:#8b8375;text-align:right}
  /* Guidance panel in the draft modal: what to do before this email goes out */
  .dtips{margin:-6px 0 22px;padding:13px 15px 14px;background:rgba(162,84,58,.07);border-radius:8px;border-left:2px solid rgba(162,84,58,.35)}
  .dtips-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#a2543a;margin-bottom:8px}
  .dtips ul{margin:0;padding-left:16px}
  .dtips li{font-family:var(--sans);font-size:12.6px;line-height:1.5;color:var(--slate);margin-bottom:5px}
  .dtips li:last-child{margin-bottom:0}
  .dtips li b{color:var(--ink);font-weight:600}
  .dchip{display:inline-flex;align-items:center;border:.75px solid #a09b91;color:#a09b91;border-radius:999px;padding:2px 12px;font-family:var(--sans);font-size:7pt;letter-spacing:.12em;text-transform:uppercase;background:transparent;white-space:nowrap}
  .dfield{position:relative}
  .dfield .dcopy{position:absolute;top:10px;right:8px;border:none;background:none;cursor:pointer;color:#9c948a;line-height:1;padding:2px;transition:color .15s;display:flex}
  .dfield .dcopy:hover{color:#000}

  /* ---------- Edit form ---------- */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;padding:8px 44px 10px}
  .form-grid .fg{display:flex;flex-direction:column}
  .form-grid .fg.full{grid-column:1/-1}
  .form-grid label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);margin-bottom:6px}
  .form-grid textarea{resize:vertical;min-height:76px}
  /* prefilled fields rest as quiet text; focus wakes the normal field chrome */
  .card .quiet:not(:focus){background:rgba(255,255,255,.31);border-color:transparent;color:#46413a;cursor:pointer}
  .card select.quiet:not(:focus){background-image:none}
  .card .quiet:not(:focus):hover{border-color:var(--rule);background:rgba(255,255,255,.5);color:#000}

<script>
const STORE = "macon_archive_v1";
const SIG_ORDER = {High:0, Med:1, Low:2, "":3};
const COLS = ["acc","name","email","first_contact","pieces","ltv","gift_self","first_buy",
  "last_buy","why","lives","details","signal","first_look","last_contact","story","notes","location","phone","photos","instagram"];
const PRODUCTS = ["Ren","Pip","Rebi","Ori","Zuma","Ibi","Milo","Yael","Eleph",
  "Caldera Arc","Sietch Ring","Lunar Canyon","Zuma Ring","Eclipse Ring","Meridian Egg","Ida's Wonder Horn","Starship Key"];
// Typical make + ship time per piece, in days. The first story ask fires lead_time + 14 (settle)
// days after the order date. Fill in real numbers as you learn them; anything unlisted uses LEAD_DEFAULT.
const LEAD_DEFAULT = 21;
const PIECE_LEAD = {
  // "Ren": 14, "Caldera Arc": 45, "Meridian Egg": 30,
};
function leadTime(piece){ return (piece && PIECE_LEAD[piece]!=null) ? PIECE_LEAD[piece] : LEAD_DEFAULT; }
// Totems carry character names; everything else in the catalog is worn (jewelry).
// Custom / unknown pieces default to the totem voice.
const CHARACTER_PIECES = ["Ren","Pip","Rebi","Ori","Zuma","Ibi","Milo","Yael","Eleph"];
function isJewelry(piece){
  if(!piece) return false;
  if(CHARACTER_PIECES.some(c=>c.toLowerCase()===piece.toLowerCase())) return false;
  return PRODUCTS.some(pr=>pr.toLowerCase()===piece.toLowerCase()) || /ring|arc|key|horn|cuff|band|pendant|necklace|earring/i.test(piece);
}
let viewMode = localStorage.getItem("macon_view") || "regular";
if(viewMode==="generous") viewMode="regular";
let page = 1;
let filterKey = "all";
let sortKey = null, sortDir = 1;
const LFILTERS = {
  all:    d=>true,
  vip:    d=>!!d.first_look,
  repeat: d=>countPieces(d.pieces)>=2,
  prospect: d=>isProspect(d),
  due:    d=>isDue(d)||isReconnectDue(d),
  story:  d=>d.story==="Yes",
};
const PAGE_SIZE = {compact:16, regular:9};

const SEED = [
  {acc:"M-001", name:"Nick Bryciewicz", email:"nick@example.com", first_contact:"Commission / word of mouth",
   pieces:"Custom totems (~100)", ltv:4200, first_buy:"2024-09", last_buy:"2025-03", gift_self:"Gift",
   why:"Wanted connection symbols to give to people in his life",
   lives:"Distributed to ~100 friends & collaborators",
   details:"Commissioned the original ~100 totems as connection symbols. The proof the collector model works.",
   signal:"High", first_look:true, last_contact:"2026-06-02", story:"Yes", notes:"Anchor case study. Treat as patron."},
  {acc:"M-014", name:"Maya", email:"maya@example.com", first_contact:"Instagram",
   pieces:"Ren, Pip", ltv:440, first_buy:"2025-01", last_buy:"2025-08", gift_self:"Self",
   why:"Drawn to the horse — said it felt like a steward",
   lives:"On her studio windowsill, morning light",
   details:"Ceramicist in Oregon. Bought a second piece after a hard year. Said Ren 'holds magic.'",
   signal:"High", first_look:true, last_contact:"2026-06-05", story:"Yes", notes:"Repeat buyer + emotional signal. Prime First Look."},
  {acc:"M-022", name:"James", email:"james@example.com", first_contact:"Friend referral (Maya)",
   pieces:"Lunar Canyon", ltv:370, first_buy:"2025-05", last_buy:"2025-05", gift_self:"Gift",
   why:"Engagement gift for his partner", lives:"Worn daily by his fiancée",
   details:"Getting married autumn 2026. Referred by Maya.",
   signal:"Med", first_look:false, last_contact:"2026-05-28", story:"Asked", notes:"Follow up after the wedding — provenance potential."},
];

let data = [];
let filter = "all";
let query = "";
let sb = null;
let synced = false;

/* ---------- Storage layer ---------- */
const local = {
  load(){ try{ const r=JSON.parse(localStorage.getItem(STORE)); if(Array.isArray(r)) return r; }catch(e){} return SEED.slice(); },
  save(){ localStorage.setItem(STORE, JSON.stringify(data)); }
};

async function boot(){
  if(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase){
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data:{ session } } = await sb.auth.getSession();
    if(session) startSynced(); else showGate();
    sb.auth.onAuthStateChange((_e, s)=>{ if(s) startSynced(); else showGate(); });
  } else {
    data = local.load(); synced=false; setSync("local","Local mode"); renderAll();
  }
}
async function startSynced(){
  hideGate(); synced=true; setSync("on","Synced");
  await refresh();
  sb.channel("collectors-rt").on("postgres_changes",{event:"*",schema:"public",table:"collectors"},()=>refresh()).subscribe();
  loadTodoDone();
  sb.channel("todos-rt").on("postgres_changes",{event:"*",schema:"public",table:"bureau_todos"},()=>loadTodoDone()).subscribe();
  initChat();
}
async function refresh(){
  if(!synced){ data=local.load(); renderAll(); return; }
  const { data:rows, error } = await sb.from("collectors").select("*").order("acc");
  if(error){ setSync("local","Sync error — check setup"); return; }
  data = rows || []; renderAll();
}
async function persist(rec, isNew){
  if(num(rec.ltv)>1000) rec.first_look=true;
  if(!synced){
    if(isNew) data.push(rec); else { const i=data.findIndex(d=>d.acc===rec.acc); if(i>=0) data[i]=rec; }
    local.save(); renderAll(); return;
  }
  const payload={}; COLS.forEach(c=>payload[c]=rec[c]); if(rec.id) payload.id=rec.id;
  const { error } = await sb.from("collectors").upsert(payload,{onConflict: rec.id?"id":"acc"});
  if(error) alert("Could not save: "+error.message);
  await refresh();
}
async function removeRec(rec){
  if(!synced){ data=data.filter(d=>d.acc!==rec.acc); local.save(); renderAll(); return; }
  const q = rec.id ? sb.from("collectors").delete().eq("id",rec.id) : sb.from("collectors").delete().eq("acc",rec.acc);
  const { error } = await q; if(error) alert("Could not remove: "+error.message);
  await refresh();
}

function countPieces(p){ if(!p||!p.trim()) return 0; return p.split(",").map(s=>s.trim()).filter(Boolean).length; }
function nextAcc(){
  let max=0; data.forEach(d=>{ const m=/M-(\d+)/.exec(d.acc||""); if(m) max=Math.max(max,+m[1]); });
  return "M-"+String(max+1).padStart(3,"0");
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function num(v){ const n=parseFloat(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
function fmtMoney(v){ const n=num(v); return v==null||v===""?"" : "$"+n.toLocaleString("en-US",{maximumFractionDigits:0}); }
function capPieces(s){ s=s||""; return s.length>20 ? s.slice(0,20).replace(/[ ,]+$/,"")+"…" : s; }
function setSync(cls,txt){ const el=document.getElementById("sync"); el.className="sync "+cls; document.getElementById("syncTxt").textContent=txt; }

/* ---------- Render dashboard ---------- */
let prevStats=null;
// True collector: repeat (2+ pieces) AND bought within the last 18 months.
// One-time recent buyers are prospects (the cultivation pool); repeat-but-quiet are lapsed.
const RECENT_DAYS = 548; // ~18 months
function isRecent(d){ const n=daysSince(d.last_buy); return n!=null && n<=RECENT_DAYS; }
function isTrueCollector(d){ return countPieces(d.pieces)>=2 && isRecent(d); }
function isProspect(d){ return countPieces(d.pieces)<2 && isRecent(d); }
function isLapsed(d){ return countPieces(d.pieces)>=2 && !isRecent(d); }
function renderDash(){
  const total=data.length;
  const fl=data.filter(d=>d.first_look).length;
  const repeat=data.filter(d=>countPieces(d.pieces)>=2).length;
  const stories=data.filter(d=>d.story==="Yes").length;
  const ltvSum=data.reduce((s,d)=>s+num(d.ltv),0);
  const avgVal=total? "$"+Math.round(ltvSum/total).toLocaleString("en-US") : "$0";
  const trueN=data.filter(isTrueCollector).length;
  const prospects=data.filter(isProspect).length;
  const lapsed=data.filter(isLapsed).length;
  const pct=Math.min(100, Math.round(trueN/200*100));
  const stats=[
    {k:"truecollectors", v:trueN,     l:"True Collectors"},
    {k:"prospects",      v:prospects, l:"Prospects"},
    {k:"repeat",         v:repeat,    l:"Repeat Collectors"},
    {k:"avgval",         v:avgVal,    l:"Avg. Value"},
  ];
  document.getElementById("dash").innerHTML = stats.map(s=>
    `<div class="stat"><div class="num" data-k="${s.k}">${s.v}</div><div class="lbl">${s.l}</div></div>`).join("");
  // highlight numbers that changed: flash to black, ease back to greige
  if(prevStats){
    stats.forEach(s=>{
      if(String(prevStats[s.k])!==String(s.v)){
        const el=document.querySelector(`.num[data-k="${s.k}"]`);
        if(el){ requestAnimationFrame(()=>{ el.classList.add("changed"); setTimeout(()=>el.classList.remove("changed"),1500); }); }
      }
    });
  }
  prevStats={}; stats.forEach(s=>prevStats[s.k]=s.v);
  document.getElementById("goalLbl").textContent = "No. of True Collectors";
  document.getElementById("goalCount").textContent = `${trueN} / 200`;
  document.getElementById("goalBar").style.width = pct + "%";

function daysSince(str){ const t=Date.parse(str); return isNaN(t)?null:Math.floor((Date.now()-t)/86400000); }

function followUps(){

    .map(x=>({...x, kind:"reconnect", days:(x.d.last_contact?daysSince(x.d.last_contact):daysSince(x.d.last_buy)), priority:"High", ask:""}));

  render();
  if(typeof Element==="undefined" || !Element.prototype.animate){ return; }
  const MOVE_DUR=240, incoming=[]; let hasMoved=false;
  host.querySelectorAll(".entry").forEach(el=>{
    const ft=first[el.dataset.i], lt=el.getBoundingClientRect().top;
    if(ft!=null){ const dy=ft-lt;
      if(Math.abs(dy)>0.5){ hasMoved=true; el.animate([{transform:`translateY(${dy}px)`},{transform:"translateY(0)"}],{duration:MOVE_DUR,easing:"cubic-bezier(.2,.8,.2,1)"}); }
    } else { incoming.push(el); }
  });
  if(!incoming.length) return;
  // Stagger new rows up from below, overlapping the reposition slightly so the
  // whole page settles within ~0.5s.
  incoming.forEach(el=>{ el.style.visibility="hidden"; });
  const base=hasMoved?120:0, DUR=180, RUN=500-base-DUR;
  const step=incoming.length>1 ? Math.max(20,RUN/(incoming.length-1)) : 0;
  incoming.forEach((el,k)=>{
    setTimeout(()=>{
      el.style.visibility="";
      el.animate([{opacity:0,transform:"translateY(22px)"},{opacity:1,transform:"translateY(0)"}],{duration:DUR,easing:"cubic-bezier(.2,.8,.2,1)"});
    }, base + k*step);
  });
}

   Three independent sequences (R/W/C) allocated server-side by new_invoice().
   Retail invoices are written by the Wix webhook and are read-only here; the
   keepers only ever hand-fill wholesale and custom.
   PDF is generated with pdf-lib, which embeds OTF/CFF outlines directly, so the
   text in the file is real selectable text in the studio's own faces. */

const INV_TAX_DEFAULT = 9.5;            // LA County. Editable per invoice.
const INV_PAPER = "#FEFCF6", INV_INK = "#1C1A18",
      INV_ORANGE = "#E2661C", INV_LABEL = "#9C8F76", INV_RULE = "#E3DED0";

           bill_addr:"", items:[{desc:"",qty:1,unit:0}],
           discount_pct:0, tax_pct: kind==="wholesale"?0:INV_TAX_DEFAULT, notes:"" };
}
function invMath(v){
  const sub = (v.items||[]).reduce((a,l)=>a + (Number(l.qty)||0) * (Number(l.unit)||0), 0);
  const disc = sub * (Number(v.discount_pct)||0) / 100;
  const taxed = sub - disc;
  const tax = taxed * (Number(v.tax_pct)||0) / 100;
  return { sub, disc, taxed, tax, total: taxed + tax };
}
function invMoney(n){
  const r = Math.round(n*100)/100;
  return "$" + (Number.isInteger(r) ? r.toLocaleString("en-US")
    : r.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}));

function invDate(s){
  const t = Date.parse((s||"")+"T00:00:00"); if(isNaN(t)) return "";
  const d = new Date(t), p = n => String(n).padStart(2,"0");
  return `${p(d.getMonth()+1)}.${p(d.getDate())}.${String(d.getFullYear()).slice(2)}`;
}

  if(_pdfjsReady) return _pdfjsReady;
  const add=src=>new Promise((res,rej)=>{ const t=document.createElement("script");
    t.src=src; t.onload=res; t.onerror=()=>rej(new Error("could not load "+src)); document.head.appendChild(t); });
  _pdfjsReady=(async()=>{
    if(!window.pdfjsLib) await add("https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js");
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
    return window.pdfjsLib;
  })();
  return _pdfjsReady;
}

// Draw every sheet to canvas, then lay the editable fields over them.
async function invPaintSheets(bytes, width, height, fields, pages){
  const pdfjsLib=await loadPdfJs();
  const host=document.getElementById("ivsSheets"); if(!host) return;
  const box=host.getBoundingClientRect();
  if(box.width<40 || box.height<40) return;   // pane collapsed; nothing to draw into
  // fit a sheet to the pane, leaving room for the gaps between multiples
  const avail=Math.max(1, box.height-(pages-1)*16-4);
  const scale=Math.min(box.width/width, pages>1 ? avail/height : box.height/height);
  const cssW=Math.floor(width*scale), cssH=Math.floor(height*scale);
  const dpr=Math.min(window.devicePixelRatio||1, 2);

  const doc=await pdfjsLib.getDocument({data:bytes.slice()}).promise;
  host.innerHTML="";
  const painting=[];
  for(let pi=0; pi<doc.numPages; pi++){
    const page=await doc.getPage(pi+1);
    const vp=page.getViewport({scale:(cssW/width)*dpr});
    const wrap=document.createElement("div");
    wrap.className="ivs-sheet"; wrap.style.width=cssW+"px"; wrap.style.height=cssH+"px";
    const cv=document.createElement("canvas");
    cv.width=Math.floor(vp.width); cv.height=Math.floor(vp.height);
    wrap.appendChild(cv); host.appendChild(wrap);
    // The fields do not depend on the raster, so they go on straight away. A
    // render promise can stall indefinitely while the pane is hidden, and the
    // sheet would otherwise come back with nothing to type into.
    painting.push(page.render({canvasContext:cv.getContext("2d"), viewport:vp}).promise.catch(()=>{}));
    invLayFields(wrap, fields.filter(f=>f.page===pi), cssW/width, height);
  }
  Promise.all(painting).then(()=>doc.destroy()).catch(()=>{});
}

function invLayFields(wrap, fields, k, pageH){
  const v=invS.v;
  fields.forEach(f=>{
    const el=document.createElement(f.key==="desc" ? "textarea" : "input");
    el.className="ivf";
    el.style.left  = (f.x*k)+"px";
    el.style.top   = ((pageH-f.y-f.h)*k)+"px";
    el.style.width = (f.w*k)+"px";
    el.style.height= (f.h*k)+"px";
    el.style.fontSize  = (f.size*k)+"px";
    el.style.textAlign = f.align;
    el.style.setProperty("--ivf-ink", f.colour);
    if(f.rotate) el.style.transform="rotate("+(-f.rotate)+"deg)";
    if(el.tagName==="TEXTAREA"){ el.style.resize="none"; el.style.overflow="hidden"; el.rows=1; }

    const read=()=>{
      if(f.key==="bill_to")   return v.bill_to||"";
      if(f.key==="issued_on") return invDate(v.issued_on);
      const it=(v.items||[])[f.idx]||{};
      if(f.key==="qty")  return "x"+(Number(it.qty)||0);
      if(f.key==="unit") return invMoney(Number(it.unit)||0);
      return it.desc||"";
    };
    el.value=read();
    el.title=({bill_to:"Bill to",issued_on:"Date",qty:"Quantity",desc:"Description",unit:"Cost"})[f.key]||"";

    el.oninput=()=>{
      const raw=el.value;
      if(f.key==="bill_to") v.bill_to=raw;
      else if(f.key==="qty")  v.items[f.idx].qty  = raw.replace(/[^0-9]/g,"");
      else if(f.key==="unit") v.items[f.idx].unit = raw.replace(/[^0-9.]/g,"");
      else if(f.key==="desc") v.items[f.idx].desc = raw;
      else if(f.key==="issued_on"){
        const m=/^(\d{2})\D(\d{2})\D(\d{2})$/.exec(raw.trim());
        if(m) v.issued_on=`20${m[3]}-${m[1]}-${m[2]}`;
      }
      invRenderForm();            // keep the side panel in step
      invQueuePreview();
    };
    // leaving a field repaints the sheet at once, and the input goes transparent
    // again so what you are looking at is the document rather than a stand-in
    el.onblur=()=>{ el.value=read(); invQueuePreview(true); };
    el.onkeydown=e=>{ if(e.key==="Enter" && el.tagName!=="TEXTAREA"){ e.preventDefault(); el.blur(); } };
    wrap.appendChild(el);
  });
}

/* live preview: the real file, rebuilt on a debounce */
function invQueuePreview(now){
  clearTimeout(invS.timer);
  const p=document.getElementById("ivsPending"); if(p) p.classList.add("on");
  // Long enough not to rebuild mid-word, short enough to still feel connected.
  // Leaving a field rebuilds at once, so tabbing through never waits.
  invS.timer=setTimeout(async()=>{
    try{
      const r=await invoicePDF(invS.v);
      await invPaintSheets(r.bytes, r.width, r.height, r.fields, r.pages);
    }catch(e){ console.error("[invoice preview]", e); }
    if(p) p.classList.remove("on");
  }, now ? 0 : 1500);
}

/* ---------- PDF plumbing ---------- */
let _pdfLibReady=null;
function loadPdfLib(){
  if(_pdfLibReady) return _pdfLibReady;
  const add=src=>new Promise((res,rej)=>{ const s=document.createElement("script");
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error("could not load "+src)); document.head.appendChild(s); });
  _pdfLibReady=(async()=>{
    if(!window.PDFLib)  await add("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js");
    if(!window.fontkit) await add("https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js");
    return { PDFLib:window.PDFLib, fontkit:window.fontkit };
  })();
  return _pdfLibReady;
}
async function fontBytes(p){ const r=await fetch(p); if(!r.ok) throw new Error("missing font "+p); return new Uint8Array(await r.arrayBuffer()); }


/* ---------- PDF ----------
   One renderer, one source of truth. Everything that can overflow is measured
   before it is drawn: descriptions wrap then ellipsize, the TO field shrinks to
   fit before it truncates, the cost column sizes to its widest figure, and the
   table paginates rather than running off the sheet. */

// Trim a string to fit a width, ending in an ellipsis.
function fitText(str, font, size, maxW){
  str=String(str||"");
  if(font.widthOfTextAtSize(str,size)<=maxW) return str;
  let s=str;
  while(s.length>1 && font.widthOfTextAtSize(s+"…",size)>maxW) s=s.slice(0,-1);
  return s.replace(/\s+$/,"")+"…";
}
// Wrap to at most maxLines, ellipsizing the last line if anything is left over.
function wrapText(str, font, size, maxW, maxLines){
  const words=String(str||"").trim().split(/\s+/).filter(Boolean);
  if(!words.length) return [];
  const lines=[]; let cur="";
  for(let i=0;i<words.length;i++){
    const t=cur?cur+" "+words[i]:words[i];
    if(font.widthOfTextAtSize(t,size)<=maxW){ cur=t; continue; }
    if(cur){ lines.push(cur); cur=words[i]; }
    else { lines.push(fitText(words[i],font,size,maxW)); cur=""; }
    if(lines.length===maxLines){
      const left=((cur?cur+" ":"")+words.slice(i+1).join(" ")).trim();
      if(left) lines[maxLines-1]=fitText(lines[maxLines-1]+" …",font,size,maxW);
      return lines;
    }
  }
  if(cur) lines.push(cur);
  return lines.slice(0,maxLines);
}

async function invoicePDF(v){
  const { PDFLib, fontkit } = await loadPdfLib();
  const { PDFDocument, rgb, degrees } = PDFLib;
  const hex=h=>rgb(parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255);

  const doc=await PDFDocument.create();
  doc.registerFontkit(fontkit);
  const [flap, birdie, loma, gab] = await Promise.all([
    fontBytes("fonts/tay-flapjack.ttf"), fontBytes("fonts/tay-birdie.ttf"),
    fontBytes("fonts/loma.ttf"), fontBytes("fonts/gabriele-l.ttf")
  ]);
  // Birdie and Loma are embedded whole: pdf-lib's subsetter drops most outlines
  // from the OTF-to-TTF conversion, leaving blank text.
  const F={ title:await doc.embedFont(flap,{subset:true}),
            caps: await doc.embedFont(birdie,{subset:false}),
            small:await doc.embedFont(loma,{subset:false}),
            type: await doc.embedFont(gab,{subset:true}) };

  const W=792, L=100, R=692, C1=152;
  const INK=hex(INV_INK), OR=hex(INV_ORANGE), LAB=hex(INV_LABEL), RULE=hex(INV_RULE);
  const m=invMath(v);
  const items=(v.items||[]).filter(l=>(l.desc||"").trim()||Number(l.unit));

  // Cost column sizes itself to the widest figure so its padding never changes.
  const COST_PAD=14;
  const costCells=[...items.map(l=>invMoney(Number(l.unit)||0)), invMoney(m.sub),
    ...(Number(v.discount_pct)?["−"+invMoney(m.disc)]:[]),
    ...(Number(v.tax_pct)?[invMoney(m.tax)]:[])];
  const costW=Math.max(52, ...costCells.map(t=>F.type.widthOfTextAtSize(t,11)))+COST_PAD*2;
  const C2=R-costW, COST_MID=(C2+R)/2, DESC_X=C1+16, DESC_W=C2-DESC_X-16;

  const totalsRows=[["Subtotal", invMoney(m.sub)]]
    .concat(Number(v.discount_pct) ? [[Number(v.discount_pct)+"% off", "−"+invMoney(m.disc)]] : [])
    .concat(Number(v.tax_pct) ? [["Tax "+Number(v.tax_pct)+"%", invMoney(m.tax)]] : []);

  // The sheet grows downward rather than spilling onto a second page. It starts
  // at landscape letter and stretches to at most 8.5 x 11 proportions; only past
  // that does it paginate.
  const BASE_H=612, MAX_H=Math.round(W*11/8.5), ROW=34, HDR_BASE=376, LAST_FLOOR=108;
  const capAt=dy=>Math.floor((HDR_BASE-10+dy-LAST_FLOOR)/ROW);
  const maxDy=MAX_H-BASE_H, maxRows=capAt(maxDy);
  const wanted=Math.max(items.length,4)+totalsRows.length;
  const singleDy=Math.max(0, Math.min(maxDy, ROW*wanted-(HDR_BASE-10-LAST_FLOOR)));

  let sheets, dy;
  if(wanted<=capAt(maxDy)){ sheets=[items]; dy=singleDy; }
  else {
    dy=maxDy;
    const lastCap=Math.max(1,maxRows-totalsRows.length), fullCap=maxRows;
    sheets=[]; let rest=items.slice();
    while(rest.length>lastCap) sheets.push(rest.splice(0,fullCap));
    sheets.push(rest);
    if(sheets.length>1 && !sheets[sheets.length-1].length) sheets[sheets.length-1].push(sheets[sheets.length-2].pop());
  }
  const H=BASE_H+dy;

  let sealPng=null;
  try{ sealPng=await doc.embedPng(new Uint8Array(await (await fetch("logos/red-stamp-alt.png")).arrayBuffer())); }
  catch(e){ /* no seal on file, the document still stands */ }

  const fields=[];   // {page,key,idx,x,y,w,h,size,align,rotate} in PDF points
  const trackedW=(t,font,size,tracking)=>{
    const cs=[...String(t)], base=c=>c==="Ç"?"C":c==="ç"?"c":c;
    return cs.reduce((a,c)=>a+font.widthOfTextAtSize(base(c),size)+tracking,0)-tracking;
  };

  sheets.forEach((sheetItems, si)=>{
    const page=doc.addPage([W,H]);
    const last = si===sheets.length-1;
    page.drawRectangle({x:0,y:0,width:W,height:H,color:hex(INV_PAPER)});

    // pdf-lib has no letter-spacing, so tracked caps are drawn glyph by glyph
    const tracked=(text,{font,size,color,x,y,tracking=0,align="left"})=>{
      const cs=[...String(text)], base=c=>c==="Ç"?"C":c==="ç"?"c":c;
      const w=trackedW(text,font,size,tracking);
      let cx = align==="center" ? x-w/2 : align==="right" ? x-w : x;
      for(const c of cs){
        const g=base(c);
        page.drawText(g,{x:cx,y,size,font,color});
        if(g!==c){
          // TAY Birdie has no cedilla of its own, so one is drawn: a comma
          // centred beneath the C.
          const cs2=size*0.95, gw=font.widthOfTextAtSize(g,size), mw=font.widthOfTextAtSize(",",cs2);
          page.drawText(",",{x:cx+(gw-mw)/2, y:y-size*0.13, size:cs2, font, color});
        }
        cx+=font.widthOfTextAtSize(g,size)+tracking;
      }
      return w;
    };
    const text=(t,{font,size,color,x,y,align="left",rotate=0})=>{
      const w=font.widthOfTextAtSize(String(t),size);
      const tx = align==="center" ? x-w/2 : align==="right" ? x-w : x;
      page.drawText(String(t),{x:tx, y, size, font, color, ...(rotate?{rotate:degrees(rotate)}:{})});
      return w;
    };
    const rule=(x1,x2,y,c=RULE,t=0.8)=>page.drawLine({start:{x:x1,y},end:{x:x2,y},thickness:t,color:c});

    // masthead and meta sit relative to the top, so they ride up as the sheet grows
    tracked("ARTIFACT",              {font:F.caps,size:9.5,color:INK,x:150,y:560+dy,tracking:2.4,align:"center"});
    tracked("INVOICING & REMITTANCE",{font:F.caps,size:9.5,color:INK,x:150,y:539+dy,tracking:2.4,align:"center"});
    tracked("FORM",                  {font:F.caps,size:9.5,color:INK,x:150,y:518+dy,tracking:2.4,align:"center"});
    tracked("MAÇON",                 {font:F.caps,size:9.5,color:INK,x:642,y:560+dy,tracking:2.4,align:"center"});
    tracked("BUREAU OF PROVENANCE",  {font:F.caps,size:9.5,color:INK,x:642,y:539+dy,tracking:2.4,align:"center"});
    tracked("2023",                  {font:F.caps,size:9.5,color:INK,x:642,y:518+dy,tracking:2.4,align:"center"});
    text("ARTIFACT",   {font:F.title,size:37,color:INK,x:396,y:548+dy,align:"center"});
    text("REQUISITION",{font:F.title,size:37,color:INK,x:396,y:514+dy,align:"center"});

    /* TO / INVOICE NO. / DATE. The TO cell stretches as its name grows and the
       other two give ground, but never past the point where their own figures
       keep 16pt of air either side. Beyond that the name truncates. */
    const metaY=424+dy, GAP=24, AVAIL=R-L-GAP*2, third=AVAIL/3;
    const metaFields=[["TO", v.bill_to||""],["INVOICE NO.", v.number||""],["DATE", invDate(v.issued_on)]];
    const labW=metaFields.map(([l])=>trackedW(l,F.caps,8.5,1.6));
    const need=i=>labW[i]+12+F.type.widthOfTextAtSize(String(metaFields[i][1]),13)+32;
    const floor2=need(1), floor3=need(2);
    let w1=Math.max(third, labW[0]+12+F.type.widthOfTextAtSize(String(metaFields[0][1]),13)+32);
    w1=Math.min(w1, AVAIL-floor2-floor3);
    w1=Math.max(w1, third*0.7);
    let rest=AVAIL-w1, w2=Math.max(floor2, rest/2), w3=rest-w2;
    if(w3<floor3){ w3=floor3; w2=rest-w3; }
    const widths=[w1,w2,w3], META_TILT=[-1.1,0.7,-0.6];
    let mx=L;
    metaFields.forEach(([label,val],i)=>{
      const x0=mx, x1=mx+widths[i]; mx=x1+GAP;
      const lw=tracked(label,{font:F.caps,size:8.5,color:INK,x:x0,y:metaY+4,tracking:1.6});
      const rx0=x0+lw+12, cellW=x1-rx0-4;
      let vs=13;
      while(vs>10 && F.type.widthOfTextAtSize(String(val),vs)>cellW) vs-=0.5;
      text(fitText(val,F.type,vs,cellW),
        {font:F.type,size:vs,color:OR,x:(rx0+x1)/2,y:metaY+2,align:"center",rotate:META_TILT[i]});
      rule(rx0-6,x1,metaY-6);
      if(i!==1) fields.push({page:si, key:i===0?"bill_to":"issued_on", x:rx0-6, y:metaY-4,
        w:x1-rx0+6, h:vs*1.6, size:vs, align:"center", rotate:META_TILT[i], colour:INV_ORANGE});
    });
    if(v.bill_addr) text(fitText(v.bill_addr,F.type,7,widths[0]),{font:F.type,size:7,color:LAB,x:L,y:404+dy});

    // table
    const hdr=HDR_BASE+dy;
    rule(L,R,hdr+18); rule(L,R,hdr-10);
    tracked("AMT.",                     {font:F.small,size:7,color:LAB,x:L+18,y:hdr,tracking:1.2});
    tracked("DESCRIPTION OF SERVICE(S)",{font:F.small,size:7,color:LAB,x:DESC_X,y:hdr,tracking:1.2});
    tracked("COST",                     {font:F.small,size:7,color:LAB,x:COST_MID,y:hdr,tracking:1.2,align:"center"});

    const rows = sheets.length===1 ? Math.max(sheetItems.length,4)
               : (last ? Math.max(sheetItems.length,1) : sheetItems.length);
    const y=hdr-10;
    for(let i=0;i<rows;i++){
      const rowY=y-ROW*i, mid=rowY-23, l=sheetItems[i];
      if(l){
        text("x"+(Number(l.qty)||0),{font:F.type,size:10,color:INK,x:L+18,y:mid});
        const ls=wrapText(l.desc,F.type,11,DESC_W,2), LH=13;
        ls.forEach((ln,k)=>text(ln,{font:F.type,size:11,color:INK,x:DESC_X,y:mid+((ls.length-1)/2)*LH-k*LH}));
        text(invMoney(Number(l.unit)||0),{font:F.type,size:11,color:INK,x:COST_MID,y:mid,align:"center"});
        const gi=(sheets.slice(0,si).reduce((a,c)=>a+c.length,0))+i;   // index into v.items
        fields.push({page:si,key:"qty", idx:gi,x:L+14,   y:mid-5,w:C1-L-24,   h:16,size:10,align:"left",  colour:INV_INK});
        fields.push({page:si,key:"desc",idx:gi,x:DESC_X-4,y:mid-6,w:DESC_W+8,h:18,size:11,align:"left",  colour:INV_INK});
        fields.push({page:si,key:"unit",idx:gi,x:C2+6,   y:mid-6,w:costW-12, h:18,size:11,align:"center",colour:INV_INK});
      }
      rule(L,R,rowY-ROW);
    }
    let ty=y-ROW*rows;
    if(last) totalsRows.forEach(([label,val])=>{
      const mid=ty-23;
      text(label,{font:F.type,size:10,color:INK,x:C2-18,y:mid,align:"right"});
      text(val,  {font:F.type,size:10,color:INK,x:COST_MID,y:mid,align:"center"});
      rule(L,R,ty-ROW); ty-=ROW;
    });
    page.drawLine({start:{x:C2,y:hdr+18},end:{x:C2,y:ty},thickness:0.8,color:RULE});
    page.drawLine({start:{x:C1,y:hdr+18},end:{x:C1,y:y-ROW*rows},thickness:0.8,color:RULE});
    page.drawLine({start:{x:L,y:hdr+18},end:{x:L,y:ty},thickness:0.8,color:RULE});
    page.drawLine({start:{x:R,y:hdr+18},end:{x:R,y:ty},thickness:0.8,color:RULE});

    // The seal lands on the table's last line and is struck last, over the top.
    // The left of the totals rows is always empty, so nothing is obscured.
    if(last && sealPng){
      const s=142, r=sealPng.height/sealPng.width, th=12*Math.PI/180, cx=136, cy=ty+17;
      page.drawImage(sealPng,{ x: cx-(s/2)*Math.cos(th)+(s*r/2)*Math.sin(th),
                               y: cy-(s/2)*Math.sin(th)-(s*r/2)*Math.cos(th),
                               width:s, height:s*r, rotate:degrees(12), opacity:0.92});
    }

    if(last){
      // Total due grows leftward: right edge pinned to the table's, with exactly
      // 32pt of air either side of the figure.
      const totalStr=invMoney(m.total)+"—";
      const tw=F.type.widthOfTextAtSize(totalStr,16);
      const tx1=R, tx0=tx1-(tw+64);
      tracked("TOTAL DUE",{font:F.caps,size:8.5,color:INK,x:tx0-14,y:82,tracking:1.4,align:"right"});
      text(totalStr,{font:F.type,size:16,color:OR,x:(tx0+tx1)/2,y:80,align:"center"});
      rule(tx0,tx1,70);
      if(v.notes) text(fitText(v.notes,F.type,9.5,420),{font:F.type,size:9.5,color:LAB,x:16,y:16});
    }
    if(sheets.length>1)
      tracked(`SHEET ${si+1} OF ${sheets.length}`,{font:F.small,size:7,color:LAB,x:R,y:16,tracking:1.2,align:"right"});
  });

  const bytes=await doc.save();
  const name=(v.number||"invoice")+" "+(v.bill_to||"").replace(/[^\w \-]/g,"").trim();
  return { bytes, filename:name.trim()+".pdf", width:W, height:H, fields, pages:sheets.length };
}
function invoiceDownload(v){
  return invoicePDF(v).then(({bytes,filename})=>{
    const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
    const a=document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  });
}

function editionGet(tmpl, ed){
  const base=LETTER_EDITIONS[tmpl] && LETTER_EDITIONS[tmpl][ed]; if(!base) return null;

  return base;
}
function editionSave(tmpl, ed, subject, body){
  const base=LETTER_EDITIONS[tmpl] && LETTER_EDITIONS[tmpl][ed]; if(!base) return;
  if(subject===base.subject && body===base.body) localStorage.removeItem("macon_ed_"+tmpl+"_"+ed);
  else localStorage.setItem("macon_ed_"+tmpl+"_"+ed, JSON.stringify({subject, body}));
}

const ORDER_TODO_CUTOFF="2026-06-10"; // orders entered after this date also surface as to-dos
// Persistent completion: letters and follow-ups stay on the list, day after day,
// until someone checks them off. Done ids: {"letter|2026-07-06":"2026-07-08", ...}
let todoDone=null; // synced completion map {id: done date}
function briefDone(){
  if(todoDone) return todoDone;
  try{ todoDone=JSON.parse(localStorage.getItem("macon_brief_done_v2")||"{}"); }catch(e){ todoDone={}; }
  return todoDone;
}
function saveBriefLocal(){
  const m=briefDone();
  const cutoff=new Date(Date.now()-7*86400000).toLocaleDateString("en-CA");
  Object.keys(m).forEach(k=>{ if(k.startsWith("cal|") && (m[k]||"")<cutoff) delete m[k]; });
  localStorage.setItem("macon_brief_done_v2", JSON.stringify(m));
}
async function markTodo(id, isDone){
  const m=briefDone(); const today=new Date().toLocaleDateString("en-CA");
  if(isDone) m[id]=today; else delete m[id];
  saveBriefLocal();
  if(synced&&sb){ try{
    if(isDone) await sb.from("bureau_todos").upsert({id, done_at:today},{onConflict:"id"});
    else await sb.from("bureau_todos").delete().eq("id",id);
  }catch(e){} }
}
async function loadTodoDone(){
  if(!(synced&&sb)) return;
  try{
    const {data:rows, error}=await sb.from("bureau_todos").select("id,done_at");
    if(error) return;

function dayDate(offset){ const dt=new Date(); dt.setHours(12,0,0,0); dt.setDate(dt.getDate()+offset); return dt; }
function dayKey(offset){ return dayDate(offset).toLocaleDateString("en-CA"); }
function dayLabel(offset){
  if(offset===0) return "Today"; if(offset===1) return "Tomorrow"; if(offset===-1) return "Yesterday";
  return dayDate(offset).toLocaleDateString("en-US",{weekday:"long"});
}
// First day a collector's follow-up would come due (ignores snooze) — used to project ahead.
function followDueDate(d){
  const lb=Date.parse(d.last_buy);
  if(isNaN(lb) || d.story==="Yes") return null;
  return lb + (leadTime(firstPiece(d.pieces))+14)*86400000;
}
// Items for a given day offset (0 = today). Today accumulates overdue letters +
// currently-due follow-ups; other days show what is scheduled / projected to land then.
function itemsForOffset(offset, events){
  const done=briefDone();
  const dayStr=dayKey(offset), today=dayKey(0);
  const out=[];
  if(events) events.forEach(e=>{
    const ed=e.date||today;                       // older cached payloads had no date → treat as today
    if(ed===dayStr) out.push({id:"cal|"+ed+"|"+e.title, time:e.allDay?"ALL DAY":e.start, title:e.title, act:null});
  });
  BUREAU_LETTERS.forEach(t=>{
    const id="letter|"+t.date; if(done[id]) return;
    if(offset===0){
      if(t.date<=today) out.push({id, time:t.date<today?new Date(Date.parse(t.date)+43200000).toLocaleDateString("en-US",{month:"short",day:"numeric"}).toUpperCase():"", title:t.title, act:{type:"compose"}});
    } else if(t.date===dayStr){
      out.push({id, time:"", title:t.title, act:{type:"compose"}});
    }
  });
  data.forEach((d,i)=>{
    const id="fu|"+(d.acc||i)+"|"+(d.last_buy||""); if(done[id]) return;
    const lb=Date.parse(d.last_buy);
    if(isNaN(lb) || lb<Date.parse(ORDER_TODO_CUTOFF)) return;
    let show;
    if(offset===0) show=isDue(d);
    else { const due=followDueDate(d); show = due!=null && new Date(due).toLocaleDateString("en-CA")===dayStr; }
    if(show) out.push({id, time:"", title:`Follow up with ${d.name||d.acc}`, act:{type:"draft", i}});
  });
  return out;
}

  let mainItems=[];
  function renderBody(){

    el.querySelectorAll(".db-main li").forEach(li=>{

  el.querySelector(".db-prev").onclick=e=>{ e.stopPropagation(); briefFocus--; renderBody(); };
  el.querySelector(".db-next").onclick=e=>{ e.stopPropagation(); briefFocus++; renderBody(); };
  el.onclick=()=>{ if(el.classList.contains("min")) expand(); };

/* ---------- Import collectors from an orders CSV ---------- */
function parseCSV(text){
  text=text.replace(/^﻿/,""); const rows=[]; let row=[],field="",q=false,i=0;
  while(i<text.length){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"';i+=2;continue;} q=false;i++;continue;} field+=c;i++;continue; }
    if(c==='"'){q=true;i++;continue;}
    if(c===','){row.push(field);field="";i++;continue;}
    if(c==='\r'){i++;continue;}
    if(c==='\n'){row.push(field);rows.push(row);row=[];field="";i++;continue;}
    field+=c;i++;
  }
  if(field.length||row.length){row.push(field);rows.push(row);}
  return rows;
}
async function importOrdersCSV(text){
  const rows=parseCSV(text).filter(r=>r.length>1);
  if(rows.length<2){ alert("That CSV looks empty."); return; }
  const head=rows[0].map(h=>h.trim());
  const ix=n=>head.indexOf(n);
  const cE=ix("Contact email"), cItem=ix("Item"), cTot=ix("Total"), cNet=ix("Net amount"),
        cDate=ix("Date created"), cBill=ix("Billing name"), cRec=ix("Recipient name"),
        cCity=ix("Delivery city"), cCtry=ix("Delivery country"),
        cBph=ix("Billing phone"), cRph=ix("Recipient phone");
  // Order id column (Wix: "Order number"; Big Cartel: "Number"). Used to count an
  // order's Total once even when the export has one row per item.
  const cOrd=[ix("Order number"),ix("Order #"),ix("Number"),ix("Order")].find(i=>i>=0);
  // Signed parse: refunds/negative rows must subtract, not add (num() strips the minus).
  const amt=v=>{ const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };
  if(cE<0){ alert("No 'Contact email' column found — is this a Big Cartel orders export?"); return; }
  const groups=new Map();
  for(let r=1;r<rows.length;r++){ const row=rows[r];
    const email=(row[cE]||"").trim().toLowerCase(); if(!email) continue;
    let g=groups.get(email);
    if(!g){ g={email,name:"",items:[],total:0,dates:[],city:"",ctry:"",phone:"",orders:new Set()}; groups.set(email,g); }
    const nm=((cBill>=0&&row[cBill])||(cRec>=0&&row[cRec])||"").trim(); if(nm&&!g.name)g.name=nm;
    const it=(cItem>=0?row[cItem]:"").trim(); if(it)g.items.push(it);
    const oid = cOrd!=null ? (row[cOrd]||"").trim() : "";
    if(!oid || !g.orders.has(oid)){
      g.total += amt(cTot>=0?row[cTot]:(cNet>=0?row[cNet]:0));
      if(oid) g.orders.add(oid);
    }
    const dt=(cDate>=0?row[cDate]:"").trim(); if(dt)g.dates.push(dt);
    if(!g.city){ g.city=(cCity>=0?row[cCity]:"").trim(); g.ctry=(cCtry>=0?row[cCtry]:"").trim(); }
    if(!g.phone){ g.phone=((cBph>=0&&row[cBph])||(cRph>=0&&row[cRph])||"").replace(/[^0-9+]/g,""); }
  }
  const list=[...groups.values()];
  if(!list.length){ alert("No collectors found in that CSV."); return; }
  if(!confirm(`Import ${list.length} collectors from this CSV? Existing collectors with the same email will be updated.`)) return;
  let maxAcc=0; data.forEach(d=>{ const m=/M-(\d+)/.exec(d.acc||""); if(m)maxAcc=Math.max(maxAcc,+m[1]); });
  const payloads=list.map(g=>{
    const existing=data.find(d=>(d.email||"").toLowerCase()===g.email);
    const tally={}; g.items.forEach(it=>tally[it]=(tally[it]||0)+1);
    const pieces=Object.entries(tally).map(([k,v])=>v>1?`${k} ×${v}`:k).join(", ");
    const ds=g.dates.map(s=>({s,t:Date.parse(s)})).filter(x=>!isNaN(x.t)).sort((a,b)=>a.t-b.t);
    const loc=[g.city,g.ctry].filter(Boolean).join(", ");
    const acc=existing?existing.acc:("M-"+String(++maxAcc).padStart(3,"0"));
    const rec=Object.assign({}, existing||{}, {acc, email:g.email, name:g.name||(existing&&existing.name)||"",
      ltv:Math.round(g.total), pieces, location:loc, phone:g.phone,
      first_look:(existing&&existing.first_look)||Math.round(g.total)>1000,
      first_buy:ds.length?ds[0].s:(existing&&existing.first_buy)||"",
      last_buy:ds.length?ds[ds.length-1].s:(existing&&existing.last_buy)||""});
    const p={}; COLS.forEach(c=>p[c]=rec[c]!=null?rec[c]:null);
    return p;
  });
  if(synced){
    const {error}=await sb.from("collectors").upsert(payloads,{onConflict:"acc"});
    if(error){ alert("Import failed: "+error.message); return; }
    await refresh();
  } else {
    payloads.forEach(p=>{ const i=data.findIndex(d=>d.acc===p.acc); if(i>=0)data[i]=p; else data.push(p); });
    local.save(); renderAll();
  }
  page=1; renderLedger();
  alert(`Imported ${list.length} collectors.`);
}
