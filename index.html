<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maçon · Bureau of Provenance</title>
<link rel="icon" type="image/png" href="logos/crest.png">
<link rel="apple-touch-icon" href="logos/crest.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&family=Public+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  @font-face{font-family:"Louize";src:url("fonts/louize.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Louize";src:url("fonts/louize-italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
  @font-face{font-family:"DM Mono";src:url("fonts/dm-mono-300.woff2") format("woff2");font-weight:300;font-style:normal;font-display:swap}
  :root{
    --ink:#2b2622;
    --paper:#f4efe4;
    --paper-2:#efe8d9;
    /* shared by the alternating ledger rows, the drawer bg, AND the ledger/provenance toggle — keep them matched by editing only this */
    --row-alt:#f6f4f2;
    --bronze:#8c6a47;
    --bronze-deep:#6f5235;
    --slate:#5b5a55;
    --rule:#dad5c9;
    --seal:#9c4a3a;
    --accent:#db6b50;
    --accent-deep:#bd5440;
    /* chat-button gradient, shared by stars + notification fills (SVG stars use #starGrad, defined in <body>) */
    --accent-grad:linear-gradient(165deg,var(--accent),var(--accent-deep));
    --high:#e9d9c2;
    --shadow:rgba(43,38,34,.10);
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    --serif-display:"Cormorant Garamond",Georgia,serif;
    --serif-soul:"EB Garamond",Georgia,serif;
    --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background-color:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    font-size:16px;
    line-height:1.55;
    /* subtle paper texture + column gradient: flat light-white right of the seam, warm paper left of it */
    background-image:radial-gradient(circle at 20% 10%, rgba(0,0,0,.012) 0, transparent 60%),
                     radial-gradient(circle at 80% 80%, rgba(0,0,0,.012) 0, transparent 60%),
                     linear-gradient(to right, var(--paper) 0%, var(--paper) calc(19vw - 116px), #fefdfb calc(26vw - 72px), #fefdfb 100%);
    -webkit-font-smoothing:antialiased;
  }
  body.has-ticker .wrap{padding-top:34px}
  body.has-ticker .col-right,body.has-ticker .col-left{height:calc(100vh - 34px)}
  body.has-ticker .drawer,body.has-ticker .drawer-rail{top:30px;height:calc(100vh - 30px)}
  body.has-ticker .sync{top:44px}
  .ticker{position:fixed;top:0;left:0;right:0;height:30px;z-index:60;display:none;align-items:center;overflow:hidden;
    background:var(--ink,#2b2622);color:#e8e2d6;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    box-shadow:0 2px 10px rgba(40,37,35,.25)}
  .ticker.show{display:flex}
  .ticker .tk-track{display:flex;flex:0 0 auto;white-space:nowrap;animation:tk-scroll var(--tk-dur,40s) linear infinite}
  .ticker:hover .tk-track{animation-play-state:paused}
  .ticker .tk-item{display:inline-flex;align-items:center;padding:0 28px}
  .ticker .tk-time{color:#d8a868;margin-right:10px}
  .ticker .tk-dot{margin:0 0 0 28px;color:var(--bronze,#a8845c)}
  @keyframes tk-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .daybrief{position:fixed;top:66px;left:calc(4.5vw - 24px);right:auto;z-index:55;width:calc(21vw - 28px);background:rgba(252,250,245,.38);border:1px solid var(--rule);
    border-radius:12px;box-shadow:0 18px 44px rgba(40,37,35,.22);padding:22px 24px 28px 30px;
    -webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1);
    animation:db-in .35s cubic-bezier(.2,.8,.2,1);box-sizing:border-box;
    transition:width .38s cubic-bezier(.2,.8,.2,1),height .38s cubic-bezier(.2,.8,.2,1),padding .38s cubic-bezier(.2,.8,.2,1)}
  .daybrief.min{display:none}
  .daybrief.min>*:not(.db-icon){display:none}
  .daybrief .db-icon{display:none;border:none;background:transparent;padding:0;margin:0;color:#000;cursor:pointer;line-height:0}
  .daybrief.min .db-icon{display:block}
  @keyframes db-in{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:translateY(0)}}
  .daybrief .db-kicker{display:inline-flex;align-items:center;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#4f7d57;background:rgba(79,125,87,.13);border:none;border-radius:999px;padding:3px 11px;margin-bottom:9px}
  .daybrief h3{font-family:"Louize",Georgia,serif;font-weight:400;font-size:29px;margin:0;color:var(--ink)}
  .daybrief h3 i{font-style:italic;font-size:25px}
  .daybrief .db-rule{border:none;border-top:1px solid #e4ded1;margin:8px 0 24px}
  .daybrief ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;width:100%}
  .daybrief li{position:relative;display:flex;gap:13px;align-items:baseline;width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);line-height:1.35;cursor:pointer;padding-right:24px;transition:color .15s}
  .daybrief li .db-check{position:absolute;right:0;top:50%;transform:translateY(-50%);opacity:0;color:#a09b91;transition:opacity .15s;pointer-events:none}
  .daybrief li .db-go{position:absolute;right:24px;top:50%;transform:translateY(-50%);opacity:0;color:#a09b91;transition:opacity .15s,color .12s;cursor:pointer;border:none;background:transparent;padding:2px;line-height:0;display:flex}
  .daybrief li:hover .db-go{opacity:1}
  .daybrief li .db-go:hover{color:var(--ink)}
  .daybrief li.has-go{padding-right:46px}
  .daybrief li:hover .db-check{opacity:1}
  .daybrief li.done{color:#a09b91}
  .daybrief li.done .db-text{text-decoration:line-through;text-decoration-thickness:.75px}
  .daybrief li.done .db-time{color:#bcb5a6}
  .daybrief li.done .db-check{opacity:1;color:#4f7d57}
  .daybrief li .db-time{flex:0 0 auto;font-family:var(--mono);font-size:10px;color:var(--bronze);letter-spacing:.06em}
  .daybrief li .db-text{flex:1;min-width:0}
  .daybrief .db-kicker-row{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .daybrief .db-kicker-row .db-kicker{margin-bottom:0}
  .daybrief .db-nav{flex:0 0 auto;border:none;background:transparent;color:#b3ab9c;font-size:15px;line-height:1;cursor:pointer;padding:2px 5px;border-radius:6px;font-family:var(--sans);transition:color .15s,background .15s}
  .daybrief .db-nav:hover{color:var(--ink);background:rgba(0,0,0,.05)}
  .daybrief .db-main{width:100%}
  .daybrief .db-clear{font-family:var(--serif-soul);font-style:italic;font-size:13px;color:#b3ab9c}
  .daybrief .db-ahead{width:100%;margin-top:20px;padding-top:16px;border-top:1px solid #e4ded1}
  .daybrief .db-ahead-h{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#b3ab9c;margin-bottom:11px}
  .daybrief .db-ahead-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;width:100%}
  .daybrief .db-ahead-list li{position:relative;display:flex;gap:13px;align-items:baseline;width:100%;font-family:var(--sans);font-size:13px;color:var(--ink);line-height:1.35;cursor:default;padding-right:0}


  /* ===== Letters view — the default surface: one pressing follow-up at a time =====
     Poster-scale type, real invoice paper (#FEFCF6, the same colour the PDF
     uses), the actual studio stamp. Overlines are Public Sans, all caps,
     regular weight; everything meant to be read is the serif, exaggerated. */
  #viewToggle{position:fixed;top:16px;left:16px;z-index:70;display:flex;gap:2px;
    background:rgba(43,38,34,.06);border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
  #viewToggle button{border:none;background:transparent;cursor:pointer;padding:7px 14px;border-radius:999px;
    font-family:"Public Sans",var(--sans);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;color:#8b8375;transition:.15s}
  #viewToggle button:hover{color:var(--ink)}
  #viewToggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(40,28,16,.14)}
  body.view-letters{padding-right:0}
  body.view-letters .wrap,body.view-letters .progress-card,body.view-letters .drawer,
  body.view-letters .drawer-rail,body.view-letters .rail-handle{display:none}
  body.view-classic .letters-view{display:none}

  .lv-overline{font-family:"Public Sans",var(--sans);text-transform:uppercase;font-weight:400}

  .letters-view{position:relative;height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;
    padding:48px 40px;box-sizing:border-box;gap:22px;overflow:hidden;
    background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.6),rgba(180,166,140,.16) 78%)}
  .lv-empty{font-family:var(--serif-soul);font-style:italic;font-size:22px;color:#a89d89;text-align:center;max-width:460px}
  /* Badge + compose live in the fixed top bar now, not on the paper — the
     paper's own overflow:hidden (needed to clip the stamp) was clipping them
     too whenever they bled past its edge. #lvTopbar's `right` is set in JS,
     measured off the view toggle's actual rendered edge, so "+" always sits
     just to its left regardless of the toggle's own width. */
  /* Same box as the sheet, so the buttons ride its actual top-right corner
     rather than the top of the grid row, which sits higher. */
  /* Placed from the sheet's measured rect: the sheet and an aspect-ratio box
     resolve their heights against different bases once the column caps the
     width, so deriving this in CSS drifts by a few pixels. */
  .lv-topbar{position:absolute;z-index:60;display:flex;align-items:center;gap:10px}
  /* Mailbox connections sit where they cannot be missed, since a box that has
     not consented is the difference between Send working and not. */
  .lv-mailbar{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:70;
    display:flex;align-items:center;gap:8px}
  .lv-mailbar:empty{display:none}
  .lv-mailbar button{font-family:var(--sans);font-size:11px;letter-spacing:.04em;cursor:pointer;
    border-radius:999px;padding:6px 14px;transition:.15s}
  .lv-mb-connect{color:#fff;background:var(--accent-grad);border:none;box-shadow:0 3px 10px rgba(189,84,64,.28)}
  .lv-mb-reconnect{color:#a89d89;background:rgba(255,255,255,.72);border:1px solid var(--rule)}
  .lv-mb-reconnect:hover{color:var(--accent-deep);border-color:var(--accent)}
  .lv-new{width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:#fff;
    color:#8c7f68;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .lv-new:hover{color:var(--ink);border-color:#a89d89}
  .lv-badge{min-width:38px;height:38px;padding:0 10px;border-radius:999px;background:var(--accent-grad);color:#fff;
    font-family:var(--sans);font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;
    box-shadow:0 3px 10px rgba(189,84,64,.4)}

  /* Three columns, the outer two forced equal, so the paper in the middle is
     always exactly centered in the viewport regardless of the label's width —
     the label sits in column 1, hugging the paper's left edge, rather than
     being counted as part of what gets centered. */
  .lv-scene{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:40px;flex:1;min-height:0;width:100%}
  /* Anchored to the paper's own column and shifted fully to its left, rather
     than confined to column 1's leftover width — column 1 exists only to
     balance the centering and can be narrower than the label needs. Name and
     quote are one block again, centered together as a unit rather than
     name-at-top-note-pushed-to-bottom. */
  /* Anchored back to the paper's own column, left side this time, 24px off
     its edge — a fixed offset from the sheet again, not from the viewport. */
  .lv-label{grid-column:1;grid-row:1;justify-self:center;align-self:center;z-index:2;
    display:flex;flex-direction:column;justify-content:center;
    width:313px;padding:28px;box-sizing:border-box;border-radius:6px;background:rgba(255,255,255,.42);
    font-size:11px;line-height:1.8;color:#8c7f68;letter-spacing:.06em;
    transition:opacity .2s}
  .lv-label .lv-name{font-family:"TAY Flapjack",var(--serif-soul);font-style:normal;font-weight:400;font-size:38px;line-height:1.2;
    color:var(--ink);margin-bottom:2px;text-transform:uppercase;letter-spacing:-.04em}
  .lv-label .lv-fact{opacity:.85}
  .lv-ctx{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 8px}
  .lv-ctx-kind{font-family:"Public Sans",var(--sans);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    color:#5a5040;background:#dcd3c0;border-radius:999px;padding:3px 9px}
  .lv-ctx-pri{font-family:"Public Sans",var(--sans);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    border-radius:999px;padding:3px 9px;font-weight:600}
  .lv-pri-high{color:#fff;background:#c8452f}
  .lv-pri-medium{color:#fff;background:#b8935f}
  .lv-pri-low{color:#fff;background:#6fa15a}
  .lv-ctx-flag{font-family:"Public Sans",var(--sans);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
    border-radius:999px;padding:3px 9px;font-weight:600}
  .lv-flag-patron{color:#fff;background:#4a6b8a}
  .lv-flag-comm{color:#fff;background:#6b5a8a}
  .lv-flag-win{color:#5a5040;background:#dcd3c0}
  .lv-aftercare{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
  .lv-file-open,.lv-call{font-family:"Public Sans",var(--sans);font-size:11.5px;letter-spacing:.04em;
    background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;
    color:#8c7f68;cursor:pointer;text-decoration:none;text-transform:none}
  .lv-file-open:hover,.lv-call:hover{border-color:var(--accent);color:var(--accent-deep)}
  .lv-file{display:flex;flex-direction:column;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
  .lv-file label{display:flex;flex-direction:column;gap:3px;font-family:"Public Sans",var(--sans);
    font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:#a89d89}
  .lv-file textarea,.lv-file input{font-family:"Public Sans",var(--sans);font-size:13px;line-height:1.5;
    color:var(--ink);background:rgba(255,255,255,.6);border:1px solid var(--rule);border-radius:3px;
    padding:7px 9px;resize:vertical;text-transform:none;letter-spacing:0;width:100%;box-sizing:border-box}
  .lv-file textarea:focus,.lv-file input:focus{outline:none;border-color:var(--accent)}
  .lv-file-seg{display:flex;gap:6px}
  .lv-file-seg button{font-family:"Public Sans",var(--sans);font-size:11px;letter-spacing:.06em;
    border:1px solid var(--rule);background:transparent;color:#8c7f68;border-radius:999px;padding:4px 14px;cursor:pointer}
  .lv-file-seg button.on{background:var(--accent-grad);color:#fff;border-color:transparent}
  .lv-file-act{display:flex;gap:8px;justify-content:flex-end;margin-top:2px}
  .lv-file-act button{font-family:"Public Sans",var(--sans);font-size:12px;border-radius:6px;padding:6px 13px;cursor:pointer}
  #lvFileCancel{background:transparent;border:none;color:#a89d89}
  #lvFileSave{background:var(--accent-grad);color:#fff;border:none}
  .lv-quote,.lv-quote-edit{margin-top:18px;padding-top:16px;border-top:1px solid var(--rule);font-family:"Public Sans",var(--sans);
    font-style:normal;font-size:15.5px;line-height:1.6;color:var(--slate);letter-spacing:0;text-transform:none}
  .lv-quote-edit{box-sizing:border-box;width:100%;border-width:1px 0 0;border-style:solid;border-color:var(--rule);
    background:transparent;resize:vertical;min-height:60px;padding-left:0;padding-right:0}
  .lv-quote-edit:focus{outline:none}

  .lv-paper{grid-column:2;grid-row:1;height:92%;max-height:92%;aspect-ratio:8.5/11;width:auto;background:#FFFEFC;border-radius:2px;
    box-shadow:0 26px 80px rgba(30,22,14,.10),0 2px 10px rgba(30,22,14,.06);
    padding:44px 48px 0;box-sizing:border-box;position:relative;overflow:hidden;z-index:3;
    display:flex;flex-direction:column}
  .lv-paper::before{content:"";position:absolute;inset:14px;border:1px solid rgba(140,106,71,.12);pointer-events:none}
  .lv-stamp{position:absolute;right:32px;top:-12px;width:175px;height:auto;opacity:.92;
    transform:rotate(-12deg);pointer-events:none;mix-blend-mode:multiply;z-index:2}
  /* the email line reads like the margin's overline facts (Public Sans, plain
     uppercase) rather than TAY Birdie, which has no glyphs for "." or "@" and
     was falling back to a different, mismatched font for just those
     characters — the "two sizes of caps" was that fallback, not a CSS bug */
  .lv-to{font-family:"Public Sans",var(--sans);font-weight:400;font-size:10px;letter-spacing:.18em;
    color:#9C8F76;margin-bottom:10px;text-transform:uppercase;
    display:flex;align-items:baseline;justify-content:flex-start;gap:16px}
  .lv-to-lab{color:#c3b9a3}
  .lv-fromline::before{content:"\2022";margin-right:16px;color:#d5cbb6}
  .lv-subj{width:100%;border:none;background:transparent;font-family:"TAY Birdie",var(--serif-soul);font-weight:400;
    font-size:30px;line-height:1.3;color:#1C1A18;padding:0 0 14px;margin-bottom:18px;border-bottom:1px solid #E3DED0;
    resize:none;overflow:hidden;display:block;letter-spacing:.01em;flex:0 0 auto;text-transform:uppercase}
  .lv-subj:focus{outline:none;border-bottom-color:var(--accent)}
  /* Two flexible spacers rather than a single centered box: a 4:6 split
     settles the block 10% above true center (50/50 would be dead center),
     with the block itself unchanged otherwise — same auto height, same wrap. */
  .lv-body-wrap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;overflow-y:auto;box-sizing:border-box}
  .lv-body-wrap::before{content:"";flex:4}
  .lv-body-wrap::after{content:"";flex:6}
  .lv-body{width:78%;border:none;background:transparent;resize:none;font-family:"Gabriele Dark","Gabriele Light",var(--serif-soul);font-size:18px;
    line-height:1.55;color:#1C1A18;min-height:0;position:relative;z-index:1;overflow:hidden;flex:0 0 auto}
  .lv-body:focus{outline:none}
  .lv-signoff{width:78%;text-align:left;margin:30px 0 0;padding:1px 0 1px 10px;border:none;background:transparent;cursor:pointer;
    font-family:"Gabriele Dark","Gabriele Light",var(--serif-soul);font-size:18px;color:#1C1A18;border-bottom:1px dotted transparent}
  .lv-signoff:hover{border-bottom-color:#a89d89;color:var(--accent-deep)}

  /* the footer is part of the sheet itself, not a row floating below it —
     Tone and Mark closed on the left, Skip and Send on the right */
  .lv-footer{flex:0 0 8%;min-height:44px;display:flex;align-items:center;gap:12px;
    border-top:1px solid rgba(227,222,208,.5);margin-top:8px;margin-bottom:12px}
  .lv-footer-right{margin-left:auto;display:flex;align-items:center;gap:12px}
  .lv-tone{font-size:11.5px;letter-spacing:.1em;color:#a89d89;
    background:transparent;border:1px solid var(--rule);border-radius:999px;padding:6.5px 14px;cursor:pointer}
  .lv-tone:hover{border-color:#a89d89;color:var(--ink)}
  .lv-fromline{font-size:10px;letter-spacing:.18em;color:#c3b9a3;white-space:nowrap;text-transform:uppercase}
  .lv-close,.lv-skip{font-family:var(--sans);font-size:13.75px;color:#a89d89;background:transparent;border:none;cursor:pointer;
    padding:8.8px 4.4px}
  .lv-close:hover,.lv-skip:hover{color:var(--ink)}
  .lv-send{font-family:var(--sans);font-size:14.3px;letter-spacing:.02em;font-weight:500;color:#fff;
    background:var(--accent-grad);border:none;border-radius:8px;padding:12px 24px;cursor:pointer;
    box-shadow:0 6px 18px rgba(189,84,64,.32)}
  .lv-send{display:inline-flex;align-items:center}
  .lv-send::after{content:"\2192";display:inline-block;max-width:0;opacity:0;margin-left:0;overflow:hidden;
    transform:translateX(-4px);transition:max-width .2s ease,opacity .2s ease,margin-left .2s ease,transform .2s ease}
  .lv-send:hover{filter:brightness(1.05)}
  .lv-send:hover::after{max-width:1.2em;opacity:1;margin-left:8px;transform:none}

  /* Motion: the paper enters with a small settle rather than popping in, and
     Mark closed gets its own send-off — a checkmark, then the sheet slides
     away — before the next letter takes its place. */
  @keyframes lvEnter{ from{opacity:0;transform:translateY(10px) scale(.98)} to{opacity:1;transform:none} }
  .lv-paper{ animation:lvEnter .28s cubic-bezier(.2,.8,.2,1) both }
  /* ghosts animate opacity only: a transform keyframe with fill "both" would
     pin transform:none and erase their tilt for good */
  @keyframes lvGhostIn{ from{opacity:0} to{opacity:1} }
  .lv-ghost{ animation:lvGhostIn .28s ease both }
  @keyframes lvSlideAway{ to{ transform:translateX(-140%) rotate(-6deg); opacity:0 } }
  .lv-paper.lv-closing{ animation:lvSlideAway .45s cubic-bezier(.4,0,.2,1) forwards; pointer-events:none }
  @keyframes lvCheckPop{ 0%{transform:scale(.5);opacity:0} 60%{transform:scale(1.15);opacity:1} 100%{transform:scale(1)} }
  .lv-checkmark{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    background:rgba(255,254,252,.92);animation:lvCheckPop .35s cubic-bezier(.2,.8,.2,1)}
  .lv-checkmark svg{width:88px;height:88px;color:#6f9c5a}
  .lv-subj,.lv-body,.lv-quote-edit{transition:height .18s ease}
  /* view switch: a quick cross-fade instead of a hard cut */
  .wrap,.letters-view{transition:opacity .18s ease}
  body.lv-fading .wrap,body.lv-fading .letters-view{opacity:0}

  /* the stack: a couple of blank sheets behind the real one, each nudged and
     tilted, each with its own shadow, so the pile reads as physical */
  .lv-ghost{grid-column:2;grid-row:1;height:92%;aspect-ratio:8.5/11;background:#FFFEFC;border-radius:2px;
    box-shadow:0 14px 40px rgba(30,22,14,.16);pointer-events:none}
  .lv-ghost-1{transform:rotate(-2.5deg) translate(-10px,10px);z-index:1}
  .lv-ghost-2{transform:rotate(3deg) translate(14px,16px);z-index:0}
  .lv-ghost-3{transform:rotate(-4.5deg) translate(-18px,22px);z-index:-1}

  /* the reader: incoming post in the right gutter, same panel as the marginalia */
  .lv-reader{grid-column:3;grid-row:1;justify-self:center;align-self:center;width:320px;max-height:100%;overflow-y:auto;
    box-sizing:border-box;padding:16px;border-radius:6px;background:rgba(255,255,255,.42);
    font-family:"Public Sans",var(--sans);font-size:12.5px;line-height:1.5;color:var(--slate)}
  .lv-reader-head{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.14em;color:#8c7f68;margin-bottom:10px}
  .lv-reader-refresh,.lv-reader-back{border:none;background:transparent;color:#a89d89;cursor:pointer;font-family:var(--sans);font-size:13px;padding:2px 4px}
  .lv-reader-refresh:hover,.lv-reader-back:hover{color:var(--ink)}
  .lv-reader-back{margin:0 0 10px -4px}
  .lv-reader-note{margin:0 0 12px;color:#8c7f68}
  .lv-reader-connect{font-family:var(--sans);font-size:12.5px;color:#fff;background:var(--accent-grad);border:none;
    border-radius:8px;padding:8px 14px;cursor:pointer;margin:0 6px 6px 0}
  .lv-reader-connect.small{font-size:11.5px;padding:5px 11px;background:transparent;color:#a89d89;border:1px solid var(--rule);margin-top:12px}
  .lv-reader-connect.small:hover{border-color:var(--accent);color:var(--accent-deep)}
  .lv-reader-reconnect{font-family:var(--sans);font-size:10.5px;letter-spacing:.04em;background:transparent;
    border:none;color:#c3b9a3;cursor:pointer;padding:4px 6px;margin-top:10px;text-decoration:underline;text-underline-offset:2px}
  .lv-reader-reconnect:hover{color:var(--accent-deep)}
  .lv-reader-list{display:flex;flex-direction:column}
  .lv-reader-row{display:block;width:100%;text-align:left;border:none;border-top:1px solid var(--rule);background:transparent;
    padding:10px 0;cursor:pointer;font-family:inherit;color:inherit;transition:background .15s}
  .lv-reader-row:first-child{border-top:none}
  .lv-reader-row:hover{background:rgba(255,255,255,.5)}
  .lv-reader-row-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#8c7f68}
  .lv-reader-from{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-reader-row-subj{color:var(--ink);margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lv-reader-row.unread .lv-reader-row-subj{font-weight:600}
  .lv-reader-row-snip{font-size:11.5px;color:#8c7f68;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .lv-reader-subject{font-size:15px;color:var(--ink);margin-bottom:4px}
  .lv-reader-meta{font-size:11px;color:#8c7f68;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
  .lv-reader-body{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;color:var(--ink)}
  .lv-thread-msg{padding:12px 0;border-top:1px solid var(--rule)}
  .lv-thread-msg .lv-reader-meta{margin-bottom:6px;padding-bottom:0;border-bottom:none}
  .lv-thread-msg .lv-reader-body{max-height:260px;overflow-y:auto}

  /* chevrons sit just off the paper's own edges, in its grid cell */
  .lv-chev{grid-column:2;grid-row:1;align-self:center;z-index:4;width:38px;height:38px;padding:0;border:none;
    background:transparent;color:#cbc2b1;cursor:pointer;transition:color .15s,opacity .15s}
  .lv-chev svg{width:38px;height:38px;display:block}
  .lv-chev:hover{color:var(--ink)}
  .lv-chev:disabled{opacity:.25;cursor:default}
  .lv-chev-prev{justify-self:start;transform:translateX(calc(-100% - 40px))}
  .lv-chev-next{justify-self:end;transform:translateX(calc(100% + 40px))}

  @media(max-width:1100px){ .lv-paper{padding:36px 28px 0} .lv-subj{font-size:24px} .lv-body{font-size:14px}
    .lv-scene{grid-template-columns:1fr;justify-items:center} .lv-label{display:none} .lv-ghost{display:none} .lv-chev{display:none} .lv-reader{display:none} }

  /* ===== Studio Line — keeper chat ===== */
  .diag-fab{display:none} body.diag .diag-fab{display:block}
  .diag-fab{position:fixed;right:24px;bottom:24px;width:32px;height:32px;border-radius:50%;border:1px solid var(--rule);
    background:rgba(255,255,255,.7);color:#a89d89;font-family:var(--sans);font-size:14px;cursor:pointer;z-index:60}
  .diag-fab:hover{color:var(--ink)}
  .chat-fab{position:fixed;left:24px;bottom:24px;width:45px;height:45px;border-radius:50%;border:none;cursor:pointer;z-index:60;
    background:var(--accent-grad);
    box-shadow:0 8px 22px color-mix(in srgb,var(--accent-deep) 42%,transparent),inset 0 1px 0 rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;color:#fff;transition:transform .18s ease,box-shadow .18s ease}
  .chat-fab:hover{transform:translateY(-2px);box-shadow:0 14px 32px color-mix(in srgb,var(--accent-deep) 54%,transparent)}
  .chat-fab svg{width:19px;height:19px;display:block}
  .chat-fab .chat-badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;
    background:#e5443b;color:#fff;font-family:var(--sans);font-size:10.5px;font-weight:700;line-height:1;letter-spacing:0;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px var(--paper),0 2px 7px rgba(229,68,59,.6),0 0 11px rgba(229,68,59,.55);
    opacity:0;transform:scale(.4);transition:opacity .2s,transform .2s}
  body.chat-unread .chat-fab .chat-badge{opacity:1;transform:scale(1);animation:chatPulse 1.8s ease-out infinite}
  @keyframes chatPulse{
    0%{box-shadow:0 0 0 2px var(--paper),0 0 0 0 rgba(229,68,59,.55),0 2px 7px rgba(229,68,59,.6)}
    70%{box-shadow:0 0 0 2px var(--paper),0 0 0 7px rgba(229,68,59,0),0 2px 7px rgba(229,68,59,.6)}
    100%{box-shadow:0 0 0 2px var(--paper),0 0 0 0 rgba(229,68,59,0),0 2px 7px rgba(229,68,59,.6)}}
  body.chat-open .chat-fab{transform:scale(.92);opacity:.85}

  .chat-panel{position:fixed;left:24px;bottom:24px;width:360px;height:min(540px,calc(100vh - 48px));z-index:61;
    background:var(--paper);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 24px 64px rgba(40,28,16,.34);
    transform:translateY(16px) scale(.96);opacity:0;pointer-events:none;transform-origin:left bottom;
    transition:transform .26s cubic-bezier(.2,.8,.25,1),opacity .2s ease}
  body.chat-open .chat-panel{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}

  .chat-head{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:15px 16px 13px;
    background:linear-gradient(180deg,var(--paper-2),var(--paper));border-bottom:1px solid rgba(43,38,34,.09)}
  .chat-head .ch-av{width:34px;height:34px;border-radius:50%;flex:0 0 auto;background:#cdbfa8 var(--av-other) center/cover no-repeat}
  .chat-head .ch-meta{flex:1 1 auto;min-width:0}
  .chat-head .ch-name{font-family:"Louize",Georgia,serif;font-weight:400;font-size:21px;color:var(--ink);line-height:1.1}
  .chat-head .ch-status{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:.01em;color:#9a8f7f;margin-top:1px}
  .chat-head .ch-dot{width:7px;height:7px;border-radius:50%;background:#c3b9a8;transition:background .25s,box-shadow .25s}
  .chat-head.online .ch-dot{background:#5b9e6a;box-shadow:0 0 0 3px rgba(91,158,106,.2)}
  .chat-head .ch-close{flex:0 0 auto;border:none;background:transparent;color:#b3ab9c;font-size:20px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:8px;transition:color .15s,background .15s}
  .chat-head .ch-close:hover{color:var(--ink);background:rgba(0,0,0,.05)}

  .chat-thread{flex:1 1 auto;overflow-y:auto;padding:16px 16px 6px;display:flex;flex-direction:column;gap:8px;
    background:radial-gradient(circle at 18% 12%,rgba(140,106,71,.05),transparent 60%),radial-gradient(circle at 84% 78%,rgba(156,74,58,.045),transparent 55%),var(--paper)}
  .chat-thread::-webkit-scrollbar{width:7px}
  .chat-thread::-webkit-scrollbar-thumb{background:rgba(43,38,34,.16);border-radius:99px}

  .chat-day{align-self:center;display:flex;align-items:center;gap:10px;margin:8px 0 4px;color:#a89e8d;font-family:var(--sans);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
  .chat-day::before,.chat-day::after{content:"";display:block;width:34px;height:1px;background:rgba(43,38,34,.14)}

  .msg{max-width:86%;display:flex;align-items:flex-end;gap:7px;animation:msgIn .22s ease}
  .msg-av{width:24px;height:24px;border-radius:50%;flex:0 0 auto;background:#cdbfa8 center/cover no-repeat;box-shadow:0 1px 3px rgba(40,28,16,.18)}
  .msg.them .msg-av{background-image:var(--av-other)}
  .msg.me .msg-av{background-image:var(--av-me)}
  .msg-col{display:flex;flex-direction:column;gap:3px;min-width:0}
  .msg.them{align-self:flex-start}
  .msg.them .msg-col{align-items:flex-start}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .msg.me .msg-col{align-items:flex-end}
  .msg .bub{padding:8px 12px;border-radius:15px;font-family:var(--sans);font-size:13.5px;line-height:1.4;word-wrap:break-word;white-space:pre-wrap}
  .msg .stamp{font-family:var(--sans);font-size:10px;letter-spacing:.01em;color:#b3a996;padding:0 4px}
  .msg.them .bub{background:#fff;color:var(--ink);border:1px solid rgba(43,38,34,.07);border-bottom-left-radius:5px;box-shadow:0 2px 7px rgba(40,28,16,.06)}
  .msg.me .bub{background:var(--accent-grad);color:#f6f1e6;border-bottom-right-radius:5px;box-shadow:0 3px 9px rgba(111,82,53,.28)}
  .msg.me .stamp{color:#bcae99}
  .msg .seen{font-family:var(--sans);font-size:10px;color:var(--accent);letter-spacing:.01em;padding:0 4px;display:none}
  .msg.me.is-seen .seen{display:block}
  @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .chat-typing{display:none;align-items:center;gap:7px;padding:2px 16px 6px;font-family:var(--sans);font-size:11.5px;color:#9a8f7f}
  body.chat-typing-on .chat-typing{display:flex}
  .chat-typing .tdots{display:inline-flex;gap:3px}
  .chat-typing .tdots i{width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.5;animation:tbounce 1.1s infinite}
  .chat-typing .tdots i:nth-child(2){animation-delay:.18s}
  .chat-typing .tdots i:nth-child(3){animation-delay:.36s}
  @keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:.9}}

  .chat-err{display:none;font-family:var(--sans);font-size:11.5px;color:var(--seal);background:rgba(156,74,58,.08);padding:7px 14px;border-top:1px solid rgba(156,74,58,.16)}
  .chat-err.show{display:block}
  .chat-compose{position:relative;flex:0 0 auto;display:flex;align-items:flex-end;gap:8px;padding:11px 12px 13px;border-top:1px solid rgba(43,38,34,.09);background:var(--paper-2)}
  .chat-inputwrap{position:relative;flex:1 1 auto;display:flex}
  .chat-compose textarea{flex:1 1 auto;box-sizing:border-box;resize:none;border:none;border-radius:13px;background:#faf7f0;color:var(--ink);font-family:var(--sans);font-size:13.5px;line-height:1.35;min-height:42px;height:42px;padding:11px 64px 6px 12px;max-height:100px;outline:none}
  .chat-compose textarea:focus{outline:none;box-shadow:none}
  .chat-compose textarea::placeholder{color:#b3a996;font-style:normal}
  .chat-send,.chat-emoji{position:absolute;bottom:13px;width:16px;height:16px;padding:0;border:none;background:transparent;cursor:pointer;color:#9b9488;display:flex;align-items:center;justify-content:center;transition:transform .15s,opacity .15s,color .15s}
  .chat-send{right:12px}
  .chat-emoji{right:36px}
  .chat-send:hover,.chat-emoji:hover{transform:scale(1.1);color:var(--bronze-deep)}
  .chat-send:disabled{opacity:.35;cursor:default;transform:none}
  .chat-send svg,.chat-emoji svg{width:16px;height:16px;display:block}
  .chat-emoji-pop{position:absolute;bottom:56px;right:12px;width:236px;max-height:184px;overflow-y:auto;background:#fff;border:1px solid rgba(43,38,34,.1);border-radius:12px;box-shadow:0 12px 30px rgba(40,28,16,.22);padding:8px;display:none;grid-template-columns:repeat(7,1fr);gap:2px;z-index:62}
  .chat-emoji-pop.show{display:grid}
  .chat-emoji-pop button{border:none;background:transparent;cursor:pointer;font-size:18px;line-height:1;padding:5px 0;border-radius:7px;transition:background .12s}
  .chat-emoji-pop button:hover{background:rgba(140,106,71,.12)}
  /* incoming-message toast — shown top-right when a message arrives with the panel closed */
  .chat-toast{position:fixed;top:20px;right:20px;z-index:70;width:322px;max-width:calc(100vw - 40px);
    display:flex;gap:11px;align-items:flex-start;padding:13px 34px 14px 14px;
    background:rgba(252,250,245,.98);-webkit-backdrop-filter:blur(12px) saturate(1.1);backdrop-filter:blur(12px) saturate(1.1);
    border:1px solid rgba(43,38,34,.10);border-radius:14px;box-shadow:0 14px 34px rgba(40,28,16,.20);
    cursor:pointer;opacity:0;transform:translateX(24px);transition:opacity .25s ease,transform .25s cubic-bezier(.2,.8,.2,1);pointer-events:none}
  .chat-toast.show{opacity:1;transform:translateX(0);pointer-events:auto}
  .chat-toast .ct-av{width:38px;height:38px;flex:0 0 auto;border-radius:50%;background:#cdbfa8 var(--av-other) center/cover no-repeat;box-shadow:0 1px 4px rgba(40,28,16,.18)}
  .chat-toast .ct-body{flex:1;min-width:0}
  .chat-toast .ct-name{font-family:"Louize",Georgia,serif;font-size:15px;color:var(--ink);line-height:1.1;margin-bottom:3px}
  .chat-toast .ct-msg{font-family:var(--sans);font-size:13px;line-height:1.4;color:#6f685c;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .chat-toast .ct-x{position:absolute;top:8px;right:9px;width:22px;height:22px;border:none;background:transparent;color:#b3a996;cursor:pointer;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .15s,color .15s}
  .chat-toast .ct-x:hover{background:rgba(43,38,34,.06);color:var(--ink)}
  .daybrief .db-ahead-list .db-text{flex:1;min-width:0}
  .daybrief .db-x{position:absolute;top:10px;right:12px;width:28px;height:28px;border:none;background:transparent;color:var(--slate);
    font-size:20px;line-height:1;cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center}
  .daybrief .db-x:hover{background:var(--paper-2);color:var(--ink)}
  .wrap{margin:0;padding:0 40px 150px;min-height:100vh;display:grid;grid-template-columns:30% 1fr;gap:44px;align-items:start}
  .col-left{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  .mast{animation:rise .45s ease both .04s}
  body:not(.booted) .dash .stat:nth-child(1){animation:rise .45s ease both .12s}
  body:not(.booted) .dash .stat:nth-child(2){animation:rise .45s ease both .17s}
  body:not(.booted) .dash .stat:nth-child(3){animation:rise .45s ease both .22s}
  body:not(.booted) .dash .stat:nth-child(4){animation:rise .45s ease both .27s}
  .progress-card{animation:rise .45s ease both .34s}
  .tabsbar{animation:rise .45s ease both .4s}
  .toolbar{animation:rise .45s ease both .08s}
  .ledger-head{animation:rise .45s ease both .16s}
  .pager{animation:rise .45s ease both .55s}
  .col-right{min-width:0;padding-top:40px;height:100vh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:40px}
  @media(max-width:820px){
    .wrap{grid-template-columns:1fr;gap:24px}
    .col-left{position:static;height:auto}
    .col-right{padding-top:0;height:auto;overflow:visible;padding-bottom:24px}
    .col-right .ledger{flex:none}
  }

  /* ---------- Sync badge ---------- */
  .sync{position:fixed;top:14px;right:18px;font-family:var(--sans);font-size:10px;
        letter-spacing:.14em;text-transform:uppercase;color:var(--slate);display:none;align-items:center;gap:7px;z-index:40;
        background:rgba(255,255,255,.4);padding:6px 11px;border:1px solid var(--rule)}
  .sync .led{width:7px;height:7px;border-radius:50%;background:var(--rule)}
  .sync.on .led{background:#6f8a5a} .sync.local .led{background:var(--bronze)}

  /* ---------- Masthead ---------- */
  header.mast{text-align:center;padding:0 0 6px;margin:0}
  .crest-wrap{position:relative;display:inline-block}
  .crest-img{display:block;width:296px;max-width:100%;height:auto}
  .stamp{display:none}
  body.view-classic .stamp{position:fixed;top:max(-89.6px,calc(-9.08vw + 47.2px));left:max(-89.6px,calc(-9.08vw + 47.2px));height:min(337.5px,calc(34.2vw - 177.8px));width:auto;z-index:-1;pointer-events:none;transform:rotate(-20deg)}
